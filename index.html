<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NEXORA AI — Intelligence Beyond Limits</title>
<style>
:root{
  --bg-0:#050505; --bg-1:#0a0a0c;
  --surface:rgba(18,18,22,.65); --surface-2:rgba(10,10,12,.85);
  --border:rgba(255,255,255,.06); --border-2:rgba(255,255,255,.15);
  --gold:#d4af37; --gold-2:#f3d786; --gold-dark:#997a00;
  --silver:#e0e0e0; --silver-2:#a0a0b0; --silver-3:#606070;
  --cyan:#88ccff;
  --text:#ffffff; --text-2:#b0b0b8; --text-3:#707080;
  --ok:#5df2b0; --warn:#ffb84d; --err:#ff8080;
  --r:12px; --r-lg:20px;
  --shadow:0 20px 40px -15px rgba(0,0,0,.9);
  --glow:0 0 30px rgba(212,175,55,.1);
  --font:"Vazirmatn","IRANSansX",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:var(--font);background:var(--bg-0);color:var(--text);font-size:14.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(212,175,55,.3);color:#fff}
h1,h2,h3,h4,p{margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px}

/* ════ CORE BACKGROUND (Luxury) ════ */
.bg-layer{position:fixed;inset:0;z-index:-3;overflow:hidden;
  background:
    radial-gradient(1000px 800px at 80% -10%,rgba(30,30,40,.6),transparent 60%),
    radial-gradient(800px 600px at 10% 110%,rgba(20,20,25,.8),transparent 60%),
    linear-gradient(180deg,#050505 0%,#08080a 50%,#050505 100%)}
.bg-star{position:absolute;border-radius:50%;background:var(--silver);
  animation:twinkle 4s ease-in-out infinite;opacity:.1}
@keyframes twinkle{0%,100%{opacity:.05;transform:scale(.8)}50%{opacity:.4;transform:scale(1.2)}}
.bg-glow{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:80px 80px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 10%,transparent 70%);
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 10%,transparent 70%)}

/* ════ GLASS CARD ════ */
.glass{position:relative;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(24px) saturate(120%);backdrop-filter:blur(24px) saturate(120%);
  box-shadow:var(--shadow);transition:border-color .4s, box-shadow .4s}
.glass:hover{border-color:var(--border-2);box-shadow:0 20px 50px -15px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.05)}

/* ════ AUTH SCREEN ════ */
.auth-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;overflow-y:auto;
  background:radial-gradient(circle at 50% 50%,rgba(20,20,25,.8) 0%,#050505 100%)}
.auth-card{width:100%;max-width:420px;padding:40px 34px;margin:auto;animation:cardIn .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.brand-lockup{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:32px}
.brand-n{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;
  font-size:28px;font-weight:900;color:#050505;
  background:linear-gradient(135deg,var(--silver),var(--gold));
  box-shadow:0 0 40px rgba(212,175,55,.2)}
.brand-title{font-size:22px;font-weight:800;letter-spacing:.08em;line-height:1.2;text-align:left}
.brand-title span{color:var(--gold)}
.brand-sub{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--text-3);margin-top:4px;text-align:left}
.auth-tabs{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.5);
  border:1px solid var(--border);border-radius:14px;margin-bottom:26px}
.auth-tab{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:600;
  color:var(--text-3);transition:.3s}
.auth-tab.active{color:#050505;background:linear-gradient(135deg,var(--silver),var(--gold-2));
  box-shadow:0 4px 15px -4px rgba(212,175,55,.4)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border-radius:12px;
  background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);
  outline:none;transition:.25s;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.1)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field textarea{resize:vertical;min-height:90px;line-height:1.8}
.field select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),
    linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(0% + 16px) calc(50% - 2px),calc(0% + 21px) calc(50% - 2px);
  background-size:5px 5px;background-repeat:no-repeat;padding-left:36px}
.field select option{background:#0a0a0c;color:var(--text)}
.field-hint{font-size:11px;color:var(--text-3);margin-top:6px}
.auth-error{padding:12px 16px;border-radius:10px;background:rgba(255,128,128,.08);
  border:1px solid rgba(255,128,128,.2);color:#ffb0b0;font-size:12.5px;
  line-height:1.7;margin-bottom:16px;animation:cardIn .25s ease both}
.auth-foot{margin-top:28px;text-align:center;font-size:11.5px;color:var(--text-3);
  letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:8px}
/* Secret Dot */
.secret-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);
  opacity:.2;cursor:pointer;transition:opacity .3s, box-shadow .3s}
.secret-dot:hover{opacity:.8;box-shadow:0 0 10px var(--gold)}

/* ════ BUTTONS ════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:12px;font-size:13.5px;font-weight:700;
  transition:transform .15s,box-shadow .25s,background .25s,border-color .25s,opacity .2s;
  white-space:nowrap;user-select:none;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--silver),var(--gold-2));color:#050505;
  box-shadow:0 8px 24px -8px rgba(212,175,55,.3)}
.btn-primary:hover:not(:disabled){box-shadow:0 12px 30px -8px rgba(212,175,55,.5)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#050505;
  box-shadow:0 8px 24px -8px rgba(212,175,55,.4)}
.btn-ghost{background:rgba(255,255,255,.02);border:1px solid var(--border-2);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.06);border-color:var(--silver)}
.btn-danger{background:rgba(255,100,100,.1);border:1px solid rgba(255,100,100,.3);color:#ffb0b0}
.btn-danger:hover:not(:disabled){background:rgba(255,100,100,.2);border-color:var(--err);color:var(--err)}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:10px}
.btn-block{width:100%}

/* ════ APP SHELL ════ */
.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:rgba(8,8,10,.85);border-left:1px solid var(--border);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  padding:24px 18px;display:flex;flex-direction:column;gap:28px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-head{display:flex;align-items:center;gap:12px;padding:4px 8px}
.brand-n.small{width:34px;height:34px;border-radius:10px;font-size:16px;box-shadow:0 0 20px rgba(212,175,55,.2)}
.brand-title.small{font-size:14px;text-align:right}
.brand-sub.small{font-size:8px;margin-top:1px;text-align:right}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:var(--text-3);font-size:13.5px;font-weight:500;transition:.25s;text-align:right;
  position:relative;border:1px solid transparent}
.nav-item i{font-style:normal;font-size:16px;width:22px;text-align:center;transition:.25s;opacity:.6}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text)}
.nav-item:hover i{opacity:1;color:var(--gold)}
.nav-item.active{background:rgba(212,175,55,.08);color:var(--gold-2);border-color:rgba(212,175,55,.2)}
.nav-item.active i{opacity:1;color:var(--gold)}
.nav-item .badge-count{margin-right:auto;background:var(--gold);color:#050505;
  font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;min-width:20px;text-align:center}
.sidebar-foot{padding-top:18px;border-top:1px solid var(--border);display:flex;
  flex-direction:column;gap:12px;position:relative}
.user-chip{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;
  background:rgba(255,255,255,.02);border:1px solid var(--border);transition:.25s}
.user-chip:hover{border-color:var(--border-2);background:rgba(255,255,255,.04)}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:15px;font-weight:800;color:#050505;flex-shrink:0;
  background:linear-gradient(135deg,var(--silver),var(--gold))}
.user-meta{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-tier{font-size:10px;color:var(--text-3);margin-top:2px}
.logout-link{padding:10px;border-radius:10px;font-size:12px;color:var(--text-3);
  text-align:center;transition:.25s;cursor:pointer}
.logout-link:hover{background:rgba(255,100,100,.1);color:var(--err)}
.version{font-size:10px;color:var(--text-3);text-align:center;letter-spacing:.1em;
  padding:6px;position:relative;display:flex;align-items:center;justify-content:center;gap:6px}

/* Mobile */
.mobile-top{display:none}
@media(max-width:900px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .main-content{padding:80px 16px 100px}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:14px 18px;position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(8,8,10,.95);-webkit-backdrop-filter:blur(30px);
    backdrop-filter:blur(30px);border-bottom:1px solid var(--border)}
  .mobile-nav{display:flex;justify-content:space-around;gap:2px;padding:10px 8px;
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(8,8,10,.98);-webkit-backdrop-filter:blur(30px);
    backdrop-filter:blur(30px);border-top:1px solid var(--border);
    padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;
    gap:4px;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;
    color:var(--text-3);transition:.2s}
  .mobile-nav-item i{font-style:normal;font-size:18px;opacity:.6}
  .mobile-nav-item.active{color:var(--gold);background:rgba(212,175,55,.1)}
  .mobile-nav-item.active i{opacity:1;color:var(--gold)}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:12px}
  .kpi{padding:16px}
  .kpi-value{font-size:18px}
  .page-title{font-size:22px}
  .chat-wrap{height:calc(100vh - 220px)}
  .tier-grid{grid-template-columns:1fr}
}
.main-content{padding:40px 44px;max-width:1400px;margin:0 auto;width:100%;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;margin-bottom:32px;flex-wrap:wrap}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:#fff}
.page-sub{font-size:13px;color:var(--text-3);margin-top:6px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ════ CARDS & KPIs ════ */
.card{padding:24px;margin-bottom:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--silver)}
.card-title svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{position:relative;padding:22px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--border);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:transform .3s,border-color .3s,box-shadow .3s}
.kpi:hover{transform:translateY(-3px);border-color:var(--border-2);box-shadow:0 15px 30px -15px rgba(0,0,0,.8)}
.kpi-label{font-size:12px;color:var(--text-3);margin-bottom:8px;font-weight:500}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-value.cyan{color:var(--silver)}
.kpi-value.gold{color:var(--gold)}
.kpi-value.ok{color:var(--ok)}
.kpi-value.err{color:var(--err)}
.kpi-meta{font-size:11.5px;color:var(--text-3);margin-top:8px}
.kpi-icon{position:absolute;top:18px;left:18px;font-size:20px;opacity:.3}

/* ════ TABLES ════ */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.2)}
.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.data-table thead{background:rgba(255,255,255,.02)}
.data-table th{padding:14px 16px;text-align:right;font-weight:600;font-size:11.5px;
  letter-spacing:.03em;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:hover{background:rgba(255,255,255,.02)}
.data-table .name-cell{color:var(--text);font-weight:600}
.data-table .actions{display:flex;gap:8px;flex-wrap:wrap}
.tiny-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;
  border:1px solid var(--border-2);background:rgba(255,255,255,.03);
  color:var(--text-2);transition:.2s;white-space:nowrap}
.tiny-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:var(--silver)}
.tiny-btn.danger{border-color:rgba(255,128,128,.3);color:#ffb0b0}
.tiny-btn.danger:hover{background:rgba(255,128,128,.15);border-color:var(--err);color:var(--err)}
.tiny-btn.ok{border-color:rgba(93,242,176,.3);color:#b9ecd8}
.tiny-btn.ok:hover{background:rgba(93,242,176,.15);border-color:var(--ok);color:var(--ok)}

/* Badges */
.badge{display:inline-block;padding:4px 12px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.badge-free{background:rgba(255,255,255,.05);color:var(--silver-2);border-color:var(--border)}
.badge-pro{background:rgba(212,175,55,.1);color:var(--gold);border-color:rgba(212,175,55,.3)}
.badge-enterprise{background:rgba(136,204,255,.1);color:var(--cyan);border-color:rgba(136,204,255,.3)}
.badge-pending{background:rgba(255,184,77,.1);color:var(--warn);border-color:rgba(255,184,77,.3)}
.badge-approved{background:rgba(93,242,176,.1);color:var(--ok);border-color:rgba(93,242,176,.3)}
.badge-rejected{background:rgba(255,128,128,.1);color:var(--err);border-color:rgba(255,128,128,.3)}
.badge-blocked{background:rgba(255,128,128,.1);color:#ffb0b0;border-color:rgba(255,128,128,.3)}

/* ════ CHAT (Consultant) ════ */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 220px);
  min-height:450px;max-height:800px;border-radius:var(--r-lg);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.chat-head{padding:18px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.2)}
.chat-head-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 15px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.chat-head-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--silver)}
.chat-head-title span{font-size:10px;background:rgba(212,175,55,.15);color:var(--gold);
  padding:3px 10px;border-radius:99px;border:1px solid rgba(212,175,55,.3)}
.chat-head-sub{font-size:12px;color:var(--text-3);margin-top:3px}
.chat-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:flex;gap:12px;max-width:85%;animation:msgIn .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-right:auto;flex-direction:row-reverse}
.msg.bot{margin-left:auto}
.msg-avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:15px;font-weight:800;flex-shrink:0}
.msg.bot .msg-avatar{background:linear-gradient(135deg,var(--silver),var(--gold));color:#050505}
.msg.user .msg-avatar{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border-2)}
.msg-bubble{padding:14px 18px;border-radius:16px;font-size:14px;line-height:1.9;
  white-space:pre-wrap;word-break:break-word}
.msg.bot .msg-bubble{background:rgba(255,255,255,.03);border:1px solid var(--border);border-top-right-radius:4px;color:var(--text)}
.msg.user .msg-bubble{background:linear-gradient(135deg,rgba(212,175,55,.9),rgba(243,215,134,.9));
  color:#050505;font-weight:500;border-top-left-radius:4px}
.chat-typing{display:inline-flex;gap:5px;padding:18px 20px}
.chat-typing span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:typingBounce 1.2s infinite}
.chat-typing span:nth-child(2){animation-delay:.15s}
.chat-typing span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}
.chat-input-wrap{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:12px;background:rgba(0,0,0,.3)}
.chat-input{flex:1;padding:14px 20px;border-radius:14px;background:rgba(0,0,0,.4);
  border:1px solid var(--border);color:var(--text);outline:none;resize:none;font-size:14px;
  line-height:1.6;max-height:120px;min-height:52px;transition:.25s;font-family:inherit}
.chat-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.08)}
.chat-send{padding:0 24px;border-radius:14px;background:linear-gradient(135deg,var(--silver),var(--gold-2));
  color:#050505;font-weight:700;font-size:14px;transition:.2s;white-space:nowrap}
.chat-send:disabled{opacity:.4;cursor:not-allowed}

/* ════ FORECAST ════ */
.forecast-scenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0}
.scenario{padding:20px;border-radius:16px;border:1px solid var(--border);background:rgba(0,0,0,.3)}
.scenario.optimistic{border-color:rgba(93,242,176,.2)}
.scenario.realistic{border-color:rgba(212,175,55,.2)}
.scenario.pessimistic{border-color:rgba(255,128,128,.2)}
.scenario-label{font-size:11.5px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.scenario-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scenario-desc{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.7}
.confidence-bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:14px 0}
.confidence-fill{height:100%;background:linear-gradient(90deg,var(--silver),var(--gold));border-radius:99px;transition:width .8s}
.reason-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.reason-list li{padding:14px 16px;background:rgba(255,255,255,.02);border-radius:12px;
  border:1px solid var(--border);font-size:13px;line-height:1.85;color:var(--text-2)}
.reason-list li::before{content:"›";color:var(--gold);margin-left:10px;font-weight:900;font-size:16px}

/* ════ SUBSCRIPTION ════ */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin:24px 0}
.tier-card{padding:30px 24px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--border);position:relative;
  transition:transform .3s,border-color .3s,box-shadow .3s}
.tier-card:hover{transform:translateY(-4px);border-color:var(--border-2);box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.tier-card.featured{border-color:rgba(212,175,55,.4);box-shadow:0 0 50px -15px rgba(212,175,55,.15)}
.tier-card.featured::before{content:"محبوب";position:absolute;top:16px;left:16px;
  font-size:10px;padding:4px 14px;border-radius:99px;font-weight:700;
  background:linear-gradient(135deg,var(--silver),var(--gold-2));color:#050505}
.tier-card.current{border-color:rgba(136,204,255,.4)}
.tier-card.current::after{content:"سطح فعلی شما";position:absolute;top:16px;left:16px;
  font-size:10px;padding:4px 14px;border-radius:99px;font-weight:700;
  background:rgba(136,204,255,.15);color:var(--cyan);border:1px solid rgba(136,204,255,.3)}
.tier-name{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:12px}
.tier-price{font-size:32px;font-weight:900;line-height:1.2;margin-bottom:8px;color:#fff}
.tier-price small{font-size:13px;font-weight:500;color:var(--text-3)}
.tier-desc{font-size:13px;color:var(--text-3);margin-bottom:20px;line-height:1.85}
.tier-features{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:12px;min-height:120px}
.tier-features li{font-size:13px;color:var(--text-2);padding-right:24px;position:relative;line-height:1.8}
.tier-features li::before{content:"✓";position:absolute;right:0;color:var(--gold);font-weight:900;font-size:14px}

/* Receipt */
.receipt-preview{max-width:100%;max-height:400px;border-radius:12px;border:1px solid var(--border);margin-top:14px;display:block;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.receipt-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border-2);cursor:pointer;transition:.25s}
.receipt-thumb:hover{border-color:var(--gold);transform:scale(1.05)}

/* ════ ADMIN BANNER ════ */
.admin-banner{padding:18px 22px;border-radius:14px;
  background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.2);
  margin-bottom:24px;font-size:13px;color:var(--gold-2);line-height:1.85}

/* ════ MODAL ════ */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:440px;padding:30px 28px 24px;border-radius:var(--r-lg);position:relative;
  background:#0a0a0c;border:1px solid var(--border-2);
  box-shadow:0 40px 100px -20px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.05);
  animation:modalIn .3s cubic-bezier(.2,.7,.3,1);max-height:90vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-card h3{font-size:18px;font-weight:800;margin-bottom:8px;color:#fff}
.modal-sub{font-size:13px;color:var(--text-3);margin-bottom:22px;line-height:1.8}
.modal-actions{display:flex;gap:12px;margin-top:22px}
.modal-actions .btn{flex:1}
.modal-close{position:absolute;top:16px;left:16px;width:32px;height:32px;border-radius:9px;font-size:20px;
  color:var(--text-3);display:grid;place-items:center;transition:.2s}
.modal-close:hover{background:rgba(255,255,255,.08);color:#fff}

/* ════ WELCOME ════ */
.welcome-overlay{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 50%,rgba(20,20,25,.95) 0%,#050505 100%);
  animation:welcomeIn .8s ease both}
@keyframes welcomeIn{from{opacity:0}to{opacity:1}}
.welcome-content{text-align:center;max-width:600px;padding:20px}
.welcome-mark{width:90px;height:90px;border-radius:24px;margin:0 auto 28px;
  display:grid;place-items:center;font-size:38px;font-weight:900;color:#050505;
  background:linear-gradient(135deg,var(--silver),var(--gold));
  box-shadow:0 0 80px rgba(212,175,55,.3);animation:welcomePop .8s .2s cubic-bezier(.2,.7,.3,1) both}
@keyframes welcomePop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.welcome-hi{font-size:clamp(28px,5vw,42px);font-weight:800;margin-bottom:16px;line-height:1.3;animation:welcomeRise .8s .4s ease both}
.welcome-hi span{color:var(--gold)}
.welcome-sub{font-size:16px;color:var(--text-2);margin-bottom:36px;line-height:2;animation:welcomeRise .8s .6s ease both}
.welcome-content .btn{padding:16px 48px;font-size:15px;animation:welcomeRise .8s .8s ease both}
@keyframes welcomeRise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}

/* ════ TOAST ════ */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);z-index:300;
  padding:14px 28px;border-radius:12px;font-size:13.5px;font-weight:600;
  background:#121216;border:1px solid var(--border-2);color:#fff;
  box-shadow:0 20px 50px -16px rgba(0,0,0,.9);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(93,242,176,.4);color:#d5fbea}
.toast.error{border-color:rgba(255,128,128,.4);color:#ffd5cc}

/* Utilities */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-between{justify-content:space-between}
.empty{padding:44px 20px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.9}
.muted{color:var(--text-3);font-size:12.5px}
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-glow"></div>

<!-- ═══ AUTH SCREEN ═══ -->

  <div class="auth-card glass">
    <div class="brand-lockup">
      <div class="brand-n">N</div>
      <div>
        <div class="brand-title">NEXORA <span>AI</span></div>
        <div class="brand-sub">Intelligence Beyond Limits</div>
      </div>
    </div>

  <aside class="sidebar">

<!-- ═══ MODALS ═══ -->

<script>
"use strict";

const STORAGE_KEY = "nexora_v2_data";
const ADMIN_PW = "152831321";

const DB = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) this.data = JSON.parse(raw);
    } catch (e) { console.error("Load failed:", e); }
    if (!this.data || typeof this.data !== "object") this.data = this.blank();
    ["users","subscriptions","transactions","products","priceHistory","activities"].forEach(k => {
      if (!Array.isArray(this.data[k])) this.data[k] = [];
    });
    if (!this.data.settings) this.data.settings = this.defaultSettings();
    if (!this.data.session) this.data.session = null;
    if (!this.data.adminSession) this.data.adminSession = null;
    return this.data;
  },
  blank() {
    return { users: [], subscriptions: [], transactions: [], products: [],
      priceHistory: [], activities: [], settings: this.defaultSettings(),
      session: null, adminSession: null };
  },
  defaultSettings() {
    return { adminReportSchedule: "weekly", autoReportsEnabled: false, language: "fa", animations: true };
  },
  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); return true; }
    catch (e) { console.error("Save failed:", e); return false; }
  },
  reset() { localStorage.removeItem(STORAGE_KEY); this.data = this.blank(); }
};

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function genSalt() {
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function hashPassword(pw, salt) { return await sha256("nexora::v2::" + salt + "::" + pw); }
let ADMIN_HASH = null;
async function initAdminHash() { ADMIN_HASH = await sha256("nexora::admin::v2::" + ADMIN_PW); }

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = (p) => (p || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmtNum(n) {
  if (n == null || isNaN(n)) return "—";
  try { return Number(n).toLocaleString("fa-IR"); } catch (e) { return String(n); }
}
function fmtMoney(n) { return fmtNum(n) + " تومان"; }
function fmtDate(ts) {
  if (!ts) return "—";
  try { return new Date(ts).toLocaleDateString("fa-IR", { year: "numeric", month: "2-digit", day: "2-digit" }); }
  catch (e) { return "—"; }
}
function fmtDateTime(ts) {
  if (!ts) return "—";
  try { return new Date(ts).toLocaleString("fa-IR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return "—"; }
}

let _toastTimer = null;
function toast(msg, type) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.className = "toast show" + (type ? " " + type : "");
  el.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { el.hidden = true; }, 320);
  }, 2600);
}

function openModal(id) { const el = $("#" + id); if (el) el.hidden = false; }
function closeModal(id) { const el = $("#" + id); if (el) el.hidden = true; }
function openGenericModal(html) {
  const c = $("#genericModalCard");
  c.innerHTML = html;
  openModal("genericModal");
}
function closeGenericModal() { closeModal("genericModal"); }

const Auth = {
  currentUser() {
    if (!DB.data.session) return null;
    const u = DB.data.users.find(x => x.id === DB.data.session.userId);
    if (!u) { DB.data.session = null; DB.save(); return null; }
    if (u.blocked) return null;
    return u;
  },
  isLoggedIn() { return !!this.currentUser(); },
  async register(name, email, password) {
    name = String(name || "").trim();
    email = String(email || "").trim().toLowerCase();
    if (name.length < 2) return { ok: false, error: "نام باید حداقل ۲ حرف باشد" };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { ok: false, error: "ایمیل معتبر نیست" };
    if (password.length < 6) return { ok: false, error: "رمز عبور باید حداقل ۶ کاراکتر باشد" };
    if (DB.data.users.some(u => u.email === email)) return { ok: false, error: "این ایمیل قبلاً ثبت شده است" };
    const salt = genSalt();
    const passwordHash = await hashPassword(password, salt);
    const user = { id: uid("u"), email, name, passwordHash, salt, role: "user", tier: "free",
      tierExpiresAt: null, blocked: false, createdAt: Date.now(), lastLogin: Date.now() };
    DB.data.users.push(user);
    DB.data.session = { userId: user.id, ts: Date.now() };
    this.logActivity(user.id, "signup", "ثبت‌نام در پلتفرم");
    DB.save();
    return { ok: true, user };
  },
  async login(email, password) {
    email = String(email || "").trim().toLowerCase();
    const user = DB.data.users.find(u => u.email === email);
    if (!user) return { ok: false, error: "ایمیل یا رمز عبور اشتباه است" };
    if (user.blocked) return { ok: false, error: "حساب شما مسدود شده است" };
    const hash = await hashPassword(password, user.salt);
    if (hash !== user.passwordHash) return { ok: false, error: "ایمیل یا رمز عبور اشتباه است" };
    user.lastLogin = Date.now();
    DB.data.session = { userId: user.id, ts: Date.now() };
    this.logActivity(user.id, "login", "ورود به حساب");
    DB.save();
    return { ok: true, user };
  },
  logout() {
    const u = this.currentUser();
    if (u) this.logActivity(u.id, "logout", "خروج از حساب");
    DB.data.session = null;
    DB.save();
  },
  async changePassword(currentPw, newPw) {
    const user = this.currentUser();
    if (!user) return { ok: false, error: "ابتدا وارد شوید" };
    const currentHash = await hashPassword(currentPw, user.salt);
    if (currentHash !== user.passwordHash) return { ok: false, error: "رمز فعلی اشتباه است" };
    if (newPw.length < 6) return { ok: false, error: "رمز جدید باید حداقل ۶ کاراکتر باشد" };
    user.salt = genSalt();
    user.passwordHash = await hashPassword(newPw, user.salt);
    DB.save();
    return { ok: true };
  },
  logActivity(userId, type, detail) {
    DB.data.activities.push({ id: uid("a"), userId, type, detail, createdAt: Date.now() });
    if (DB.data.activities.length > 1000) DB.data.activities = DB.data.activities.slice(-1000);
  }
};

const Admin = {
  secretClicks: 0,
  secretTimer: null,
  isLoggedIn() {
    const s = DB.data.adminSession;
    if (!s) return false;
    if (Date.now() - s.ts > 12 * 3600000) {
      DB.data.adminSession = null; DB.save(); return false;
    }
    return true;
  },
  setSession() { DB.data.adminSession = { ts: Date.now() }; DB.save(); },
  clearSession() { DB.data.adminSession = null; DB.save(); },
  async verifyPassword(pw) {
    if (!ADMIN_HASH) await initAdminHash();
    const hash = await sha256("nexora::admin::v2::" + pw);
    return hash === ADMIN_HASH;
  },
  registerSecretClick(onThreshold) {
    this.secretClicks++;
    clearTimeout(this.secretTimer);
    this.secretTimer = setTimeout(() => { this.secretClicks = 0; }, 5000);
    if (this.secretClicks >= 40) {
      this.secretClicks = 0;
      clearTimeout(this.secretTimer);
      onThreshold();
    }
  },
  stats() {
    const now = Date.now();
    const day7 = now - 7 * 86400000;
    const users = DB.data.users;
    const approved = DB.data.subscriptions.filter(s => s.status === "approved");
    const revenue = approved.reduce((sum, s) => sum + (s.amount || 0), 0);
    return { totalUsers: users.length, newUsers: users.filter(u => u.createdAt >= day7).length,
      activeUsers: users.filter(u => u.lastLogin >= day7).length,
      subscribedUsers: new Set(approved.map(s => s.userId)).size,
      unsubscribedUsers: users.filter(u => u.tier === "free").length,
      pendingSubs: DB.data.subscriptions.filter(s => s.status === "pending").length,
      revenue, totalTx: DB.data.transactions.length };
  }
};

const Data = {
  addTransaction(tx) {
    const u = Auth.currentUser();
    if (!u) return { ok: false, error: "ابتدا وارد شوید" };
    if (!["income", "expense"].includes(tx.type)) return { ok: false, error: "نوع نامعتبر" };
    const amount = parseInt(tx.amount, 10);
    if (!Number.isFinite(amount) || amount <= 0) return { ok: false, error: "مبلغ باید مثبت باشد" };
    const t = { id: uid("t"), userId: u.id, type: tx.type, amount,
      category: (tx.category || "").trim() || null, description: (tx.description || "").trim() || null, createdAt: Date.now() };
    DB.data.transactions.push(t);
    Auth.logActivity(u.id, "transaction", (tx.type === "income" ? "درآمد" : "هزینه") + ": " + fmtMoney(amount));
    DB.save();
    return { ok: true, transaction: t };
  },
  userTransactions(userId, days) {
    const since = days ? Date.now() - days * 86400000 : 0;
    return DB.data.transactions.filter(t => t.userId === userId && t.createdAt >= since).sort((a, b) => b.createdAt - a.createdAt);
  },
  deleteTransaction(id) {
    const u = Auth.currentUser();
    if (!u) return false;
    const idx = DB.data.transactions.findIndex(t => t.id === id && t.userId === u.id);
    if (idx === -1) return false;
    DB.data.transactions.splice(idx, 1);
    DB.save();
    return true;
  },
  addProduct(p) {
    const u = Auth.currentUser();
    if (!u) return { ok: false, error: "ابتدا وارد شوید" };
    const name = String(p.name || "").trim();
    if (name.length < 2) return { ok: false, error: "نام باید حداقل ۲ حرف باشد" };
    const buyPrice = parseInt(p.buyPrice, 10) || 0;
    const sellPrice = parseInt(p.sellPrice, 10) || 0;
    const stock = parseFloat(p.stock) || 0;
    if (buyPrice < 0 || sellPrice < 0 || stock < 0) return { ok: false, error: "مقادیر منفی مجاز نیست" };
    const prod = { id: uid("p"), userId: u.id, name, buyPrice, sellPrice, stock, updatedAt: Date.now() };
    DB.data.products.push(prod);
    DB.data.priceHistory.push({ id: uid("ph"), productId: prod.id, buyPrice, sellPrice, recordedAt: Date.now() });
    Auth.logActivity(u.id, "product_add", "کالای جدید: " + name);
    DB.save();
    return { ok: true, product: prod };
  },
  userProducts(userId) { return DB.data.products.filter(p => p.userId === userId); },
  updateProduct(id, patch) {
    const u = Auth.currentUser();
    if (!u) return false;
    const p = DB.data.products.find(x => x.id === id && x.userId === u.id);
    if (!p) return false;
    const oldBuy = p.buyPrice, oldSell = p.sellPrice;
    if (patch.buyPrice != null) p.buyPrice = parseInt(patch.buyPrice, 10) || 0;
    if (patch.sellPrice != null) p.sellPrice = parseInt(patch.sellPrice, 10) || 0;
    if (patch.stock != null) p.stock = parseFloat(patch.stock) || 0;
    p.updatedAt = Date.now();
    if (p.buyPrice !== oldBuy || p.sellPrice !== oldSell) {
      DB.data.priceHistory.push({ id: uid("ph"), productId: p.id, buyPrice: p.buyPrice, sellPrice: p.sellPrice, recordedAt: Date.now() });
    }
    DB.save();
    return true;
  },
  deleteProduct(id) {
    const u = Auth.currentUser();
    if (!u) return false;
    const idx = DB.data.products.findIndex(p => p.id === id && p.userId === u.id);
    if (idx === -1) return false;
    const pid = DB.data.products[idx].id;
    DB.data.products.splice(idx, 1);
    DB.data.priceHistory = DB.data.priceHistory.filter(h => h.productId !== pid);
    DB.save();
    return true;
  },
  requestSubscription(tier, receiptData) {
    const u = Auth.currentUser();
    if (!u) return { ok: false, error: "ابتدا وارد شوید" };
    const TIERS = { pro: { price: 299000 }, enterprise: { price: 999000 } };
    if (!TIERS[tier]) return { ok: false, error: "سطح نامعتبر" };
    const pending = DB.data.subscriptions.find(s => s.userId === u.id && s.status === "pending");
    if (pending) return { ok: false, error: "شما یک درخواست در انتظار تأیید دارید" };
    if (!receiptData) return { ok: false, error: "تصویر رسید الزامی است" };
    const sub = { id: uid("s"), userId: u.id, tier, status: "pending", amount: TIERS[tier].price,
      receipt: receiptData, requestedAt: Date.now(), reviewedAt: null };
    DB.data.subscriptions.push(sub);
    Auth.logActivity(u.id, "sub_request", "درخواست اشتراک " + tier);
    DB.save();
    return { ok: true, subscription: sub };
  },
  mySubscriptions(userId) {
    return DB.data.subscriptions.filter(s => s.userId === userId).sort((a, b) => b.requestedAt - a.requestedAt);
  },
  approveSubscription(id) {
    const sub = DB.data.subscriptions.find(s => s.id === id);
    if (!sub || sub.status !== "pending") return { ok: false, error: "درخواست معتبر نیست" };
    sub.status = "approved"; sub.reviewedAt = Date.now();
    const user = DB.data.users.find(u => u.id === sub.userId);
    if (user) { user.tier = sub.tier; user.tierExpiresAt = Date.now() + 30 * 86400000; }
    Auth.logActivity(sub.userId, "sub_approved", "اشتراک " + sub.tier + " تأیید شد");
    DB.save();
    return { ok: true };
  },
  rejectSubscription(id, note) {
    const sub = DB.data.subscriptions.find(s => s.id === id);
    if (!sub || sub.status !== "pending") return { ok: false, error: "درخواست معتبر نیست" };
    sub.status = "rejected"; sub.reviewedAt = Date.now(); sub.adminNote = note || null;
    Auth.logActivity(sub.userId, "sub_rejected", "درخواست اشتراک رد شد");
    DB.save();
    return { ok: true };
  },
  cancelUserSubscription(userId) {
    const user = DB.data.users.find(u => u.id === userId);
    if (!user) return false;
    user.tier = "free"; user.tierExpiresAt = null;
    DB.data.subscriptions.forEach(s => {
      if (s.userId === userId && s.status === "approved") { s.status = "cancelled"; s.reviewedAt = Date.now(); }
    });
    Auth.logActivity(userId, "sub_cancelled", "لغو اشتراک توسط مدیر");
    DB.save();
    return true;
  },
  toggleBlock(userId) {
    const user = DB.data.users.find(u => u.id === userId);
    if (!user) return false;
    user.blocked = !user.blocked;
    DB.save();
    return true;
  },
  changeTier(userId, tier) {
    const user = DB.data.users.find(u => u.id === userId);
    if (!user) return false;
    user.tier = tier;
    user.tierExpiresAt = tier === "free" ? null : Date.now() + 30 * 86400000;
    Auth.logActivity(userId, "tier_change", "تغییر سطح به " + tier + " توسط مدیر");
    DB.save();
    return true;
  }
};

const Consultant = {
  parseAmounts(text) {
    const map = { "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9","٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9" };
    let t = String(text || "").replace(/[۰-۹٠-٩]/g, d => map[d]).replace(/,/g, " ");
    const results = [];
    const re = /(\d+(?:\.\d+)?)\s*(هزار|میلیون|میلیارد|تومان|ریال)?/gi;
    let m;
    while ((m = re.exec(t)) !== null) {
      let n = parseFloat(m[1]);
      const u = (m[2] || "").toLowerCase();
      if (u === "هزار") n *= 1000;
      else if (u === "میلیون") n *= 1000000;
      else if (u === "میلیارد") n *= 1000000000;
      if (n >= 100) results.push(n);
    }
    return results;
  },
  getContext(userId, days) {
    days = days || 30;
    const txs = Data.userTransactions(userId, days);
    const prods = Data.userProducts(userId);
    let income = 0, expense = 0;
    txs.forEach(t => t.type === "income" ? income += t.amount : expense += t.amount);
    const profit = income - expense;
    const margin = income > 0 ? (profit / income) * 100 : 0;
    
    let maxExpense = 0, maxIncome = 0;
    let maxExpenseTx = null, maxIncomeTx = null;
    txs.forEach(t => {
      if (t.type === "expense" && t.amount > maxExpense) { maxExpense = t.amount; maxExpenseTx = t; }
      if (t.type === "income" && t.amount > maxIncome) { maxIncome = t.amount; maxIncomeTx = t; }
    });

    return { income, expense, profit, margin, txCount: txs.length, prods, txs, maxExpense, maxExpenseTx, maxIncome, maxIncomeTx };
  },
  respond(userId, message) {
    const text = String(message || "").trim().toLowerCase();
    if (!text) return "پیام خالی است.";

    const amounts = this.parseAmounts(text);
    const ctx = this.getContext(userId);

    if (amounts.length >= 2 && (text.includes("خرید") || text.includes("فروش") || text.includes("قیمت") || text.includes("سود"))) {
      const buy = amounts[0];
      const sell = amounts[1];
      if (buy > 0 && sell > 0) {
        const profitPerUnit = sell - buy;
        const margin = (profitPerUnit / sell) * 100;
        const markup = (profitPerUnit / buy) * 100;
        let verdict = "", emoji = "";
        if (profitPerUnit < 0) { verdict = "شما در این معامله در ضرر هستید. قیمت فروش پایین‌تر از قیمت خرید است."; emoji = "🔴"; }
        else if (margin < 10) { verdict = "حاشیه سود شما پایین است. با احتساب هزینه‌های جانبی، ممکن است به مرز ضرر نزدیک شوید."; emoji = "🟡"; }
        else if (margin < 25) { verdict = "حاشیه سود شما قابل قبول است، اما فضای بهبود وجود دارد."; emoji = "🟢"; }
        else if (margin < 50) { verdict = "حاشیه سود شما خوب است. این معامله را در اولویت قرار دهید."; emoji = "🌟"; }
        else { verdict = "حاشیه سود شما بسیار بالاست. اگر فروش ادامه دارد، این محصول را تقویت کنید."; emoji = "💎"; }

        let r = emoji + " تحلیل معامله:\n\n";
        r += "• قیمت خرید: " + fmtMoney(buy) + "\n";
        r += "• قیمت فروش: " + fmtMoney(sell) + "\n";
        r += "• سود هر واحد: " + fmtMoney(profitPerUnit) + "\n";
        r += "• حاشیه سود: " + margin.toFixed(1) + "٪\n";
        r += "• نرخ افزایش: " + markup.toFixed(1) + "٪\n\n";
        r += verdict;

        if (ctx.txCount > 0) {
          r += "\n\n📊 در ۳۰ روز گذشته:\n• درآمد: " + fmtMoney(ctx.income) + "\n• هزینه: " + fmtMoney(ctx.expense) + "\n• سود خالص: " + fmtMoney(ctx.profit);
        } else {
          r += "\n\nℹ️ برای تحلیل جامع‌تر، تراکنش‌های خود را در بخش «تراکنش‌ها» ثبت کنید.";
        }
        return r;
      }
    }

    if (text.includes("بیشترین هزینه") || text.includes("گرانترین") || text.includes("بزرگترین هزینه")) {
      if (!ctx.maxExpenseTx) return "📉 هیچ هزینه‌ای در ۳۰ روز گذشته ثبت نکرده‌اید.";
      return "🔍 بزرگترین هزینه شما:\n\n• مبلغ: " + fmtMoney(ctx.maxExpense) + "\n• بابت: " + esc(ctx.maxExpenseTx.category || ctx.maxExpenseTx.description || "نامشخص") + "\n• تاریخ: " + fmtDate(ctx.maxExpenseTx.createdAt) + "\n\n💡 پیشنهاد: اگر این هزینه تکراری است، به‌دنبال راهی برای کاهش آن باشید.";
    }

    if (text.includes("بیشترین درآمد") || text.includes("بزرگترین فروش") || text.includes("بهترین فروش")) {
      if (!ctx.maxIncomeTx) return "📈 هیچ درآمدی در ۳۰ روز گذشته ثبت نکرده‌اید.";
      return "🔍 بزرگترین درآمد شما:\n\n• مبلغ: " + fmtMoney(ctx.maxIncome) + "\n• بابت: " + esc(ctx.maxIncomeTx.category || ctx.maxIncomeTx.description || "نامشخص") + "\n• تاریخ: " + fmtDate(ctx.maxIncomeTx.createdAt) + "\n\n💡 پیشنهاد: این نوع فروش را تقویت کنید.";
    }

    if (text.includes("میانگین") && (text.includes("فروش") || text.includes("درآمد"))) {
      if (!ctx.income) return "📊 هنوز درآمدی ثبت نکرده‌اید.";
      const avg = ctx.income / 30;
      return "📈 میانگین درآمد روزانه شما:\n\n• " + fmtMoney(Math.round(avg)) + " در روز\n• " + fmtMoney(Math.round(avg * 7)) + " در هفته\n\n💡 این یعنی اگر روند فعلی ادامه یابد، در ماه آینده حدود " + fmtMoney(Math.round(avg * 30)) + " درآمد خواهید داشت.";
    }

    if ((text.includes("مقایسه") || text.includes("کدام") || text.includes("بهترین")) && ctx.prods.length >= 2) {
      const list = ctx.prods.map(p => ({ name: p.name, margin: p.sellPrice > 0 ? ((p.sellPrice - p.buyPrice) / p.sellPrice * 100) : 0, profit: p.sellPrice - p.buyPrice })).sort((a, b) => b.margin - a.margin);
      let r = "🔍 مقایسه کالاها بر اساس حاشیه سود:\n\n";
      list.forEach((p, i) => { r += (i + 1) + ". " + esc(p.name) + "\n   حاشیه: " + p.margin.toFixed(1) + "٪ · سود: " + fmtMoney(p.profit) + "\n"; });
      r += "\n💡 کالاهای با حاشیه بالاتر را در اولویت بفروشید.";
      return r;
    }

    if (text.includes("قیمت") && text.includes("کالا") || ctx.prods.some(p => text.includes(p.name.toLowerCase()))) {
      let found = ctx.prods.find(p => text.includes(p.name.toLowerCase()));
      if (found) {
        const margin = found.sellPrice > 0 ? ((found.sellPrice - found.buyPrice) / found.sellPrice * 100) : 0;
        return "📦 مشخصات کالای «" + esc(found.name) + "»:\n\n• قیمت خرید: " + fmtMoney(found.buyPrice) + "\n• قیمت فروش: " + fmtMoney(found.sellPrice) + "\n• حاشیه سود: " + margin.toFixed(1) + "٪\n• موجودی: " + fmtNum(found.stock) + " واحد\n\n💡 " + (margin < 15 ? "حاشیه سود پایین است، قیمت را بازبینی کنید." : "حاشیه سود مناسب است.");
      }
    }

    if (text.includes("موجودی") || text.includes("انبار")) {
      if (ctx.prods.length === 0) return "📦 هنوز کالایی ثبت نکرده‌اید. از بخش «کالاها» اضافه کنید.";
      let total = 0; let low = [];
      let r = "📦 وضعیت انبار:\n\n";

        total += p.buyPrice * p.stock;
        if (p.stock < 3) low.push(p.name);

      });
      r += "\n💰 ارزش کل (به قیمت خرید): " + fmtMoney(total);
      if (low.length) r += "\n⚠️ نیاز به شارژ: " + low.join("، ");
      return r;
    }

    if (text.includes("وضعیت") || text.includes("چطور") || text.includes("گزارش") || text.includes("سود") || text.includes("زیان")) {
      if (ctx.txCount === 0) return "برای تحلیل، ابتدا تراکنش‌های خود را در بخش «تراکنش‌ها» ثبت کنید (حداقل ۳ مورد).";
      let health, emoji;
      if (ctx.profit < 0) { health = "شما در حال ضرر هستید. باید هزینه‌ها را کاهش دهید."; emoji = "🔴"; }
      else if (ctx.margin < 10) { health = "حاشیه سود شما پایین است."; emoji = "🟡"; }
      else if (ctx.margin < 30) { health = "وضعیت شما متعادل است."; emoji = "🟢"; }
      else { health = "حاشیه سود شما بسیار خوب است!"; emoji = "🌟"; }

      return emoji + " گزارش ۳۰ روز گذشته:\n\n• تراکنش‌ها: " + fmtNum(ctx.txCount) + "\n• درآمد: " + fmtMoney(ctx.income) + "\n• هزینه: " + fmtMoney(ctx.expense) + "\n• سود خالص: " + fmtMoney(ctx.profit) + "\n• حاشیه سود: " + ctx.margin.toFixed(1) + "٪\n\n" + health;
    }

    if (text.includes("پیشنهاد") || text.includes("چه کنم") || text.includes("راهکار") || text.includes("بهبود")) {
      const tips = [];
      if (ctx.txCount === 0) tips.push("ابتدا تراکنش‌های مالی خود را ثبت کنید.");
      else {
        if (ctx.profit < 0) tips.push("کسب‌وکار در ضرر است. هزینه‌های غیرضروری را حذف کنید.");
        if (ctx.margin < 20 && ctx.margin >= 0) tips.push("حاشیه سود پایین است. با تأمین‌کننده مذاکره کنید.");
        if (ctx.expense > 0 && ctx.income > 0 && ctx.expense / ctx.income > 0.7) tips.push("نسبت هزینه به درآمد بالاست.");
        if (ctx.profit > 0) tips.push("سود را در بازاریابی یا تنوع محصول سرمایه‌گذاری کنید.");
      }

      return "💡 پیشنهادهای مشاور:\n\n" + tips.map((t, i) => (i + 1) + ". " + t).join("\n\n");
    }

    return "سلام! من مشاور هوشمند شما هستم. می‌توانم در این موارد کمک کنم:\n\n• تحلیل معامله — «خرید ۲۰۰ هزار، فروش ۲۷۰ هزار»\n• گزارش وضعیت — «وضعیت من چطور است؟»\n• بیشترین هزینه — «بیشترین هزینه من چیه؟»\n• میانگین فروش — «میانگین فروش من چقدره؟»\n• بررسی انبار — «موجودی انبار»\n• مقایسه کالاها — «کالاها را مقایسه کن»\n• پیشنهاد — «چه کنم بهتر شود؟»";
  }
};

const Forecast = {
  linearRegression(points) {
    const n = points.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxy = 0, sxx = 0;
    points.forEach(p => { sx += p.x; sy += p.y; sxy += p.x * p.y; sxx += p.x * p.x; });
    const d = n * sxx - sx * sx;
    if (d === 0) return { slope: 0, intercept: sy / n, r2: 0 };
    const slope = (n * sxy - sx * sy) / d;
    const intercept = (sy - slope * sx) / n;
    const meanY = sy / n;
    let ssRes = 0, ssTot = 0;
    points.forEach(p => {
      const pred = slope * p.x + intercept;
      ssRes += Math.pow(p.y - pred, 2);
      ssTot += Math.pow(p.y - meanY, 2);
    });
    const r2 = ssTot === 0 ? 0 : Math.max(0, 1 - ssRes / ssTot);
    return { slope, intercept, r2 };
  },
  generate(userId, days) {
    days = days || 30;
    const txs = Data.userTransactions(userId, days);
    if (txs.length < 3) {
      return { ok: false, message: "برای پیش‌بینی، حداقل ۳ تراکنش در ۳۰ روز گذشته نیاز است. اکنون " + fmtNum(txs.length) + " تراکنش ثبت شده.", dataPoints: txs.length };
    }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const buckets = {};
    for (let i = 0; i < days; i++) {
      const d = new Date(today.getTime() - (days - 1 - i) * 86400000);
      buckets[d.toISOString().slice(0, 10)] = { income: 0, expense: 0 };
    }
    txs.forEach(t => {
      const key = new Date(t.createdAt).toISOString().slice(0, 10);
      if (!buckets[key]) return;
      if (t.type === "income") buckets[key].income += t.amount;
      else buckets[key].expense += t.amount;
    });
    const keys = Object.keys(buckets).sort();
    const incPts = keys.map((k, i) => ({ x: i, y: buckets[k].income }));
    const expPts = keys.map((k, i) => ({ x: i, y: buckets[k].expense }));
    const incR = this.linearRegression(incPts);
    const expR = this.linearRegression(expPts);
    let projInc = 0, projExp = 0;
    for (let i = 0; i < 30; i++) {
      projInc += Math.max(0, incR.slope * (days + i) + incR.intercept);
      projExp += Math.max(0, expR.slope * (days + i) + expR.intercept);
    }
    const totalInc = incPts.reduce((a, p) => a + p.y, 0);
    const totalExp = expPts.reduce((a, p) => a + p.y, 0);
    const netProfit = totalInc - totalExp;
    const avgR2 = (incR.r2 + expR.r2) / 2;
    const confidence = Math.min(95, Math.max(25, Math.round(avgR2 * 100)));
    const reasons = [];
    if (incR.slope > 1000) reasons.push("روند درآمد صعودی است (+" + fmtMoney(Math.round(incR.slope)) + " در روز).");
    else if (incR.slope < -1000) reasons.push("روند درآمد نزولی است (-" + fmtMoney(Math.round(-incR.slope)) + " در روز).");
    else reasons.push("روند درآمد تقریباً ثابت است.");
    if (expR.slope > 1000) reasons.push("روند هزینه صعودی است (+" + fmtMoney(Math.round(expR.slope)) + " در روز).");
    else if (expR.slope < -1000) reasons.push("روند هزینه نزولی است (-" + fmtMoney(Math.round(-expR.slope)) + " در روز).");
    else reasons.push("روند هزینه تقریباً ثابت است.");
    if (netProfit > 0) reasons.push("در دوره گذشته سود خالص مثبت بوده است.");
    else if (netProfit < 0) reasons.push("در دوره گذشته ضرر ثبت شده است.");
    const limitations = [];
    if (txs.length < 10) limitations.push("تعداد تراکنش‌ها کم است (" + fmtNum(txs.length) + " مورد).");
    if (avgR2 < 0.5) limitations.push("پراکندگی داده‌ها بالاست؛ پیش‌بینی قطعی نیست.");
    if (totalInc === 0) limitations.push("درآمدی در دوره ثبت نشده.");
    if (limitations.length === 0) limitations.push("پیش‌بینی بر اساس روند خطی داده‌های گذشته است.");
    return { ok: true, dataPoints: txs.length, period: days,
      history: { totalIncome: totalInc, totalExpense: totalExp, netProfit, avgDailyIncome: Math.round(totalInc / days), avgDailyExpense: Math.round(totalExp / days) },
      forecast: { projectedIncome: Math.round(projInc), projectedExpense: Math.round(projExp), projectedProfit: Math.round(projInc - projExp),
        optimistic: Math.round(projInc * 1.2 - projExp * 0.9), pessimistic: Math.round(projInc * 0.8 - projExp * 1.15),
        confidence, reasons, limitations } };
  }
};

function compressImage(file, maxSize) {
  maxSize = maxSize || 1000;
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) { reject(new Error("فقط فایل تصویری مجاز است")); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const ratio = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * ratio); height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => reject(new Error("فایل تصویری معتبر نیست"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("خطا در خواندن فایل"));
    reader.readAsDataURL(file);
  });
}

const ADMIN_ROUTE2 = { id: "admin-reports", icon: "✎", label: "گزارش‌ها" };

let currentRoute = "dashboard";

function renderNav() {
  const isUser = Auth.isLoggedIn();
  const isAdmin = Admin.isLoggedIn();
  let routes = [];
  if (isUser) routes = ROUTES.slice();
  if (isAdmin) {
    if (!isUser) routes = [];
    routes = routes.concat([ADMIN_ROUTE, ADMIN_ROUTE2]);
  }
  if (routes.length === 0) routes = ROUTES;

  const side = $("#sideNav"), mob = $("#mobileNav");
  const pendingCount = isAdmin ? DB.data.subscriptions.filter(s => s.status === "pending").length : 0;

  side.innerHTML = routes.map(r => {
    const badge = r.id === "admin" && pendingCount > 0 ? '<span class="badge-count">' + pendingCount + '</span>' : "";
    return '<button class="nav-item ' + (r.id === currentRoute ? "active" : "") + '" data-route="' + r.id + '"><i>' + r.icon + '</i><span>' + r.label + '</span>' + badge + '</button>';
  }).join("");

  mob.innerHTML = routes.slice(0, 5).map(r =>
    '<button class="mobile-nav-item ' + (r.id === currentRoute ? "active" : "") + '" data-route="' + r.id + '"><i>' + r.icon + '</i><span>' + r.label + '</span></button>'
  ).join("");

  $$("[data-route]").forEach(b => b.addEventListener("click", () => navigate(b.dataset.route)));
}

function navigate(route) {
  const isUser = Auth.isLoggedIn();
  const isAdmin = Admin.isLoggedIn();
  const adminRoutes = ["admin", "admin-reports"];

  if (!isUser && !isAdmin) return;
  if (adminRoutes.includes(route) && !isAdmin) { toast("دسترسی مدیریتی لازم است", "error"); return; }
  if (!isUser && !adminRoutes.includes(route)) {
    // If only admin is logged in, they can't see user routes
    return;
  }

  currentRoute = route;
  renderNav();
  renderPage();
}

function renderPage() {
  const user = Auth.currentUser();
  const isAdmin = Admin.isLoggedIn();
  const c = $("#pageContent");

  if (!user && !isAdmin) return;

  const renderers = { dashboard: renderDashboard, consultant: renderConsultant,
    forecast: renderForecast, products: renderProducts, transactions: renderTransactions,
    subscription: renderSubscription, settings: renderSettings, admin: renderAdmin, "admin-reports": renderAdminReports };
  
  let fn = renderers[currentRoute];
  
  if (!user && currentRoute !== 'admin' && currentRoute !== 'admin-reports') {
    currentRoute = 'admin';
    fn = renderAdmin;
  }
  
  if (!fn) fn = renderDashboard;
  
  c.innerHTML = "";
  const fallbackUser = { name: "مدیر سیستم", email: "admin", tier: "enterprise", createdAt: Date.now() };
  fn(c, user || fallbackUser);
  
  updateUserChip(user || { name: "مدیر", tier: "enterprise" });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showProductModal(existing) {
  const isEdit = !!existing;
  const p = existing || { name: "", buyPrice: "", sellPrice: "", stock: "" };
  openGenericModal(`
    <button class="modal-close" id="modalCloseBtn">×</button>
    <h3>${isEdit ? "ویرایش کالا" : "کالای جدید"}</h3>

      <div class="field"><label>قیمت خرید (تومان)</label><input id="pBuy" type="number" min="0" value="${p.buyPrice || ""}" required></div>
      <div class="field"><label>قیمت فروش (تومان)</label><input id="pSell" type="number" min="0" value="${p.sellPrice || ""}" required></div>
      <div class="field"><label>موجودی</label><input id="pStock" type="number" min="0" step="0.01" value="${p.stock || ""}" required></div>
      <div class="auth-error" id="pError" hidden></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" id="pCancel">انصراف</button><button type="submit" class="btn btn-primary">${isEdit ? "ذخیره" : "افزودن"}</button></div>
    </form>
  `);
  $("#modalCloseBtn").addEventListener("click", closeGenericModal);
  $("#pCancel").addEventListener("click", closeGenericModal);
  $("#productForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = { name: $("#pName").value, buyPrice: $("#pBuy").value, sellPrice: $("#pSell").value, stock: $("#pStock").value };
    let result;
    if (isEdit) { Data.updateProduct(existing.id, data); result = { ok: true }; }
    else { result = Data.addProduct(data); }
    if (!result.ok) { const err = $("#pError"); err.textContent = result.error; err.hidden = false; return; }
    closeGenericModal(); toast(isEdit ? "کالا ویرایش شد" : "کالا اضافه شد", "success"); renderPage();
  });

function showSubscriptionRequestModal(tierKey, tierInfo) {
  openGenericModal(`
    <button class="modal-close" id="modalCloseBtn">×</button>
    <h3>درخواست اشتراک ${tierInfo.label}</h3>
    <p class="modal-sub">مبلغ قابل پرداخت: ${fmtNum(tierInfo.price)} تومان (۳۰ روز)</p>
    <p style="font-size:13px;color:var(--text-2);line-height:1.9;margin-bottom:18px">لطفاً تصویر رسید پرداخت خود را آپلود کنید. پس از بررسی توسط مدیر، اشتراک شما فعال خواهد شد.</p>
    <div class="field"><label>تصویر رسید</label><input type="file" id="receiptFile" accept="image/*" required><div class="field-hint">فرمت مجاز: JPG، PNG، WebP · حداکثر ۵ مگابایت</div></div>
    <div id="receiptPreviewWrap" hidden><img id="receiptPreviewImg" class="receipt-preview" alt="پیش‌نمایش"></div>
    <div class="auth-error" id="subError" hidden></div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" id="subCancel">انصراف</button><button type="button" class="btn btn-primary" id="subSubmit">ثبت درخواست</button></div>
  `);
  let compressedData = null;
  $("#modalCloseBtn").addEventListener("click", closeGenericModal);
  $("#subCancel").addEventListener("click", closeGenericModal);
  $("#receiptFile").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) { compressedData = null; $("#receiptPreviewWrap").hidden = true; return; }
    if (file.size > 5 * 1024 * 1024) { const err = $("#subError"); err.textContent = "حجم فایل بیشتر از ۵ مگابایت است"; err.hidden = false; e.target.value = ""; compressedData = null; return; }
    try {
      compressedData = await compressImage(file, 1000);
      $("#receiptPreviewImg").src = compressedData; $("#receiptPreviewWrap").hidden = false; $("#subError").hidden = true;
    } catch (err) { const er = $("#subError"); er.textContent = err.message || "خطا در پردازش تصویر"; er.hidden = false; }
  });
  $("#subSubmit").addEventListener("click", () => {
    if (!compressedData) { const err = $("#subError"); err.textContent = "لطفاً تصویر رسید را آپلود کنید"; err.hidden = false; return; }
    const result = Data.requestSubscription(tierKey, compressedData);
    if (!result.ok) { const err = $("#subError"); err.textContent = result.error; err.hidden = false; return; }
    closeGenericModal(); toast("درخواست شما ثبت شد و در انتظار بررسی است", "success"); renderPage();
  });
}

    if (!u) return;
    const newTier = prompt("سطح جدید را وارد کنید (free / pro / enterprise):", u.tier);
    if (!newTier || !["free", "pro", "enterprise"].includes(newTier)) return;
    Data.changeTier(u.id, newTier); toast("سطح کاربر تغییر کرد", "success"); renderPage();
  }));
  $$("[data-cancel-sub]", container).forEach(b => b.addEventListener("click", () => {
    if (!confirm("اشتراک این کاربر لغو شود؟")) return;
    Data.cancelUserSubscription(b.dataset.cancelSub); toast("اشتراک لغو شد", "success"); renderPage();
  }));
  $$("[data-block]", container).forEach(b => b.addEventListener("click", () => {
    if (!confirm("وضعیت مسدودی این کاربر تغییر کند؟")) return;
    Data.toggleBlock(b.dataset.block); toast("وضعیت کاربر تغییر کرد", "success"); renderPage();
  }));
}

let authMode = "login";
function setAuthMode(mode) {
  authMode = mode;
  $$(".auth-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  $("#authNameField").hidden = mode !== "signup";
  $("#authPassword").autocomplete = mode === "signup" ? "new-password" : "current-password";
  $("#authSubmit").textContent = mode === "signup" ? "ساخت حساب" : "ورود به حساب";
  $("#authError").hidden = true;
}
function showAuthError(msg) { const el = $("#authError"); el.textContent = msg; el.hidden = false; }

async function handleAuthSubmit(e) {
  e.preventDefault();
  const email = $("#authEmail").value, password = $("#authPassword").value, name = $("#authName").value;
  const submitBtn = $("#authSubmit");
  submitBtn.disabled = true; submitBtn.textContent = "در حال پردازش…";
  try {
    let result;
    if (authMode === "signup") result = await Auth.register(name, email, password);
    else result = await Auth.login(email, password);
    if (!result.ok) { showAuthError(result.error); submitBtn.disabled = false; setAuthMode(authMode); return; }
    $("#authForm").reset(); $("#authScreen").hidden = true; showWelcome(result.user);
  } catch (err) {
    console.error(err); showAuthError("خطای غیرمنتظره. لطفاً دوباره تلاش کنید.");
    submitBtn.disabled = false; setAuthMode(authMode);
  }
}

function showWelcome(user) {
  $("#welcomeName").textContent = user.name;
  $("#welcomeOverlay").hidden = false;
  $("#welcomeEnter").onclick = () => { $("#welcomeOverlay").hidden = true; enterApp(user); };
}

function enterApp(user) {
  $("#appShell").hidden = false;
  currentRoute = "dashboard";
  renderNav(); renderPage();
}

function openAdminLogin() {
  if (Admin.isLoggedIn()) { navigate("admin"); return; }
  $("#adminPassword").value = ""; $("#adminError").hidden = true;
  openModal("adminModal");
  setTimeout(() => $("#adminPassword").focus(), 150);
}

async function handleAdminSubmit() {
  const pw = $("#adminPassword").value;
  if (!pw) { $("#adminError").textContent = "رمز را وارد کنید"; $("#adminError").hidden = false; return; }
  const submitBtn = $("#adminSubmit");
  submitBtn.disabled = true; submitBtn.textContent = "بررسی…";
  try {
    const ok = await Admin.verifyPassword(pw);
    if (!ok) { $("#adminError").textContent = "رمز اشتباه است"; $("#adminError").hidden = false; $("#adminPassword").value = ""; submitBtn.disabled = false; submitBtn.textContent = "ورود"; return; }
    Admin.setSession(); closeModal("adminModal"); toast("به پنل مدیریت خوش آمدید", "success");
    
    if (!Auth.isLoggedIn()) {
      $("#authScreen").hidden = true;
      $("#appShell").hidden = false;
    }
    
    navigate("admin");
  } catch (err) {
    console.error(err); $("#adminError").textContent = "خطای غیرمنتظره"; $("#adminError").hidden = false; submitBtn.disabled = false; submitBtn.textContent = "ورود";
  }
}

function initStars() {
  const bg = $("#bgLayer");
  const count = Math.min(60, Math.floor(window.innerWidth / 30));
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "bg-star";
    const size = Math.random() * 2 + 1;
    s.style.width = size + "px"; s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 5 + "s";
    s.style.animationDuration = 3 + Math.random() * 5 + "s";
    if (Math.random() > 0.8) s.style.background = "var(--gold)";
    bg.appendChild(s);
  }
}

async function bootstrap() {
  try {
    DB.load(); await initAdminHash(); initStars();
    $$(".auth-tab").forEach(t => t.addEventListener("click", () => setAuthMode(t.dataset.mode)));
    $("#authForm").addEventListener("submit", handleAuthSubmit);
    
    $("#logoutBtn").addEventListener("click", () => {
      if (!confirm("از حساب خارج می‌شوید؟")) return;
      Auth.logout(); $("#appShell").hidden = true; $("#authScreen").hidden = false;
      setAuthMode("login"); toast("از حساب خارج شدید");
    });
    $("#mobileLogout").addEventListener("click", () => {
      if (!confirm("از حساب خارج می‌شوید؟")) return;
      Auth.logout(); $("#appShell").hidden = true; $("#authScreen").hidden = false;
      setAuthMode("login"); toast("از حساب خارج شدید");
    });

    const triggerSecret = () => Admin.registerSecretClick(() => openAdminLogin());
    $("#loginSecretDot").addEventListener("click", triggerSecret);
    $("#secretDot").addEventListener("click", (e) => { e.stopPropagation(); triggerSecret(); });

    $("#adminSubmit").addEventListener("click", handleAdminSubmit);
    $("#adminPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") handleAdminSubmit(); });
    $("#adminCancel").addEventListener("click", () => closeModal("adminModal"));
    $("#adminModalClose").addEventListener("click", () => closeModal("adminModal"));
    $("#adminModal").addEventListener("click", (e) => { if (e.target === $("#adminModal")) closeModal("adminModal"); });
    $("#genericModal").addEventListener("click", (e) => { if (e.target === $("#genericModal")) closeGenericModal(); });

    const user = Auth.currentUser();
    if (user) { $("#authScreen").hidden = true; enterApp(user); }
    else { $("#authScreen").hidden = false; setAuthMode("login"); }
  } catch (err) {
    console.error("Bootstrap error:", err);
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ff8080;font-family:sans-serif">خطا در راه‌اندازی برنامه. لطفاً صفحه را دوباره بارگذاری کنید.<br><small>' + (err.message || "") + '</small></div>';
  }
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootstrap);
else bootstrap();
</script>
