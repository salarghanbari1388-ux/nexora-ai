<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>NEXORA AI — Intelligence Beyond Limits</title>
<style>
:root{
  --bg-0:#05080f; --bg-1:#0a1120; --bg-2:#0d1730;
  --surface:rgba(18,26,44,.72); --surface-2:rgba(12,18,32,.6);
  --border:rgba(78,231,255,.10); --border-2:rgba(78,231,255,.24);
  --cyan:#4ee7ff; --cyan-2:#6bb6ff; --gold:#e8c87a; --gold-2:#f5dc9c;
  --text:#eaf2ff; --text-2:#b0bfd8; --text-3:#6b7a94;
  --ok:#5df2b0; --warn:#ffb84d; --err:#ff8080;
  --r:14px; --r-lg:20px;
  --shadow:0 20px 40px -20px rgba(0,0,0,.9);
  --glow:0 0 30px rgba(78,231,255,.18);
  --font:"Vazirmatn","IRANSansX",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:var(--font);background:var(--bg-0);color:var(--text);font-size:14.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(78,231,255,.3);color:#fff}
h1,h2,h3,h4,p{margin:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(78,231,255,.16);border-radius:8px}

/* Background */
.bg-stars{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:
    radial-gradient(1200px 800px at 80% -10%,rgba(78,231,255,.10),transparent 60%),
    radial-gradient(900px 700px at 10% 110%,rgba(232,200,122,.07),transparent 60%),
    linear-gradient(180deg,#05080f 0%,#070d1b 50%,#05080f 100%)}
.bg-star{position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--cyan);animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.7;transform:scale(1.5)}}
.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(78,231,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(78,231,255,.025) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 15%,transparent 75%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 15%,transparent 75%)}

/* ══════════ AUTH SCREEN ══════════ */
.auth-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  overflow-y:auto}
.auth-card{width:100%;max-width:440px;padding:34px 30px;
  background:linear-gradient(145deg,rgba(18,26,44,.88),rgba(12,18,32,.75));
  border:1px solid var(--border);border-radius:24px;
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:var(--shadow),var(--glow);animation:cardIn .5s ease both;margin:auto}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.brand-lockup{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.brand-n{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;font-weight:900;color:#05080f;
  background:linear-gradient(135deg,var(--cyan),var(--gold));
  box-shadow:0 0 40px rgba(78,231,255,.4)}
.brand-title{font-size:18px;font-weight:800;letter-spacing:.05em;line-height:1.2}
.brand-title span{background:linear-gradient(135deg,var(--cyan),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3);margin-top:3px}
.auth-tabs{display:flex;gap:6px;padding:4px;background:rgba(0,0,0,.35);
  border:1px solid var(--border);border-radius:12px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;
  color:var(--text-3);transition:.25s}
.auth-tab.active{color:#05080f;background:linear-gradient(135deg,var(--cyan),var(--cyan-2));
  box-shadow:0 4px 12px -4px rgba(78,231,255,.6)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-3);
  margin-bottom:7px;letter-spacing:.03em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;
  background:rgba(0,0,0,.32);border:1px solid var(--border);color:var(--text);
  outline:none;transition:.25s;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--cyan);box-shadow:0 0 0 3px rgba(78,231,255,.1)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field textarea{resize:vertical;min-height:90px;line-height:1.8}
.field select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),
    linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(0% + 14px) calc(50% - 2px),calc(0% + 19px) calc(50% - 2px);
  background-size:5px 5px;background-repeat:no-repeat;padding-left:32px}
.field select option{background:#0a1120;color:var(--text)}
.field-hint{font-size:11px;color:var(--text-3);margin-top:6px}
.auth-error{padding:10px 14px;border-radius:10px;background:rgba(255,128,128,.08);
  border:1px solid rgba(255,128,128,.3);color:#ffb0b0;font-size:12px;
  line-height:1.7;margin-bottom:14px;animation:cardIn .25s ease both}
.auth-foot{margin-top:22px;text-align:center;font-size:10.5px;color:var(--text-3);
  letter-spacing:.15em;text-transform:uppercase}

/* ══════════ BUTTONS ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:700;
  transition:transform .15s,box-shadow .25s,background .25s,border-color .25s,opacity .2s;
  white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-2));color:#05080f;
  box-shadow:0 8px 24px -8px rgba(78,231,255,.55)}
.btn-primary:hover:not(:disabled){box-shadow:0 12px 30px -8px rgba(78,231,255,.75)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1408;
  box-shadow:0 8px 24px -8px rgba(232,200,122,.5)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border-2);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:rgba(78,231,255,.08);border-color:var(--cyan)}
.btn-danger{background:linear-gradient(135deg,#ff7b7b,#ff5566);color:#fff;
  box-shadow:0 8px 20px -8px rgba(255,80,100,.5)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
.btn-block{width:100%}
.btn-icon{padding:8px;width:36px;height:36px;border-radius:10px}

/* ══════════ APP SHELL ══════════ */
.app-shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:rgba(8,12,24,.75);border-left:1px solid var(--border);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:20px 14px;display:flex;flex-direction:column;gap:20px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand-n.small{width:34px;height:34px;border-radius:10px;font-size:16px;
  box-shadow:0 0 20px rgba(78,231,255,.3)}
.brand-title.small{font-size:14px}
.brand-sub.small{font-size:8px;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  color:var(--text-2);font-size:13px;font-weight:600;transition:.25s;text-align:right;
  position:relative;border:1px solid transparent}
.nav-item i{font-style:normal;font-size:15px;width:20px;text-align:center;
  color:var(--text-3);transition:.25s}
.nav-item:hover{background:rgba(78,231,255,.06);color:var(--text)}
.nav-item:hover i{color:var(--cyan)}
.nav-item.active{background:linear-gradient(90deg,rgba(78,231,255,.14),rgba(78,231,255,.04));
  color:var(--text);border-color:var(--border-2);box-shadow:inset 3px 0 0 var(--cyan)}
.nav-item.active i{color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.nav-item .badge-count{margin-right:auto;background:var(--cyan);color:#05080f;
  font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;min-width:18px;text-align:center}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border);display:flex;
  flex-direction:column;gap:10px;position:relative}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;
  background:rgba(255,255,255,.03);border:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  font-size:14px;font-weight:800;color:#05080f;flex-shrink:0;
  background:linear-gradient(135deg,var(--cyan),var(--gold))}
.user-meta{flex:1;min-width:0}
.user-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.user-tier{font-size:10px;color:var(--text-3);margin-top:1px}
.logout-link{padding:8px;border-radius:10px;font-size:11.5px;color:var(--text-3);
  text-align:center;transition:.25s}
.logout-link:hover{background:rgba(255,128,128,.08);color:var(--err)}
.version{font-size:9.5px;color:var(--text-3);text-align:center;letter-spacing:.1em;
  padding:4px;position:relative;user-select:none}

/* Secret dot for admin access */
.secret-dot{position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,var(--gold),transparent 70%);
  opacity:.18;left:8px;top:50%;transform:translateY(-50%);
  cursor:pointer;transition:opacity .3s;z-index:5}
.secret-dot:hover{opacity:.6}

/* Mobile nav */
.mobile-top{display:none}

/* Main content */
.main-content{padding:32px 36px;max-width:1400px;margin:0 auto;width:100%;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.page-sub{font-size:12.5px;color:var(--text-3);margin-top:5px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ══════════ CARDS ══════════ */
.card{background:linear-gradient(145deg,rgba(18,26,44,.72),rgba(12,18,32,.55));
  border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--shadow);margin-bottom:16px;transition:border-color .3s}
.card:hover{border-color:var(--border-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;
  color:var(--text)}
.card-title svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:22px}
.kpi{position:relative;padding:18px 18px 16px;border-radius:var(--r-lg);
  background:linear-gradient(145deg,rgba(18,26,44,.8),rgba(12,18,32,.6));
  border:1px solid var(--border);overflow:hidden;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .3s,border-color .3s}
.kpi::before{content:"";position:absolute;top:-40px;left:-40px;width:120px;height:120px;
  border-radius:50%;background:radial-gradient(circle,rgba(78,231,255,.15),transparent 70%);
  opacity:.5;pointer-events:none}
.kpi:hover{transform:translateY(-3px);border-color:var(--border-2)}
.kpi-label{font-size:11px;color:var(--text-3);letter-spacing:.04em;
  margin-bottom:6px;font-weight:600}
.kpi-value{font-size:22px;font-weight:900;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-value.cyan{color:var(--cyan)}
.kpi-value.gold{color:var(--gold)}
.kpi-value.ok{color:var(--ok)}
.kpi-value.err{color:var(--err)}
.kpi-meta{font-size:11px;color:var(--text-3);margin-top:6px}
.kpi-icon{position:absolute;top:14px;left:14px;font-size:20px;opacity:.5}

/* Charts */
.chart-wrap{background:rgba(0,0,0,.2);border-radius:12px;padding:16px;
  border:1px solid var(--border);margin-top:8px}
.chart-svg{width:100%;height:auto;display:block;max-height:240px}

/* Bar chart */
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;
  padding:0 4px;border-bottom:1px solid var(--border)}
.bar{flex:1;min-width:4px;border-radius:3px 3px 0 0;transition:opacity .2s;
  position:relative;cursor:default;min-height:2px}
.bar-income{background:linear-gradient(180deg,var(--cyan),rgba(78,231,255,.4))}
.bar-expense{background:linear-gradient(180deg,var(--err),rgba(255,128,128,.3))}
.bar:hover{opacity:.75}
.bar-labels{display:flex;justify-content:space-between;margin-top:8px;
  font-size:9.5px;color:var(--text-3)}

/* ══════════ TABLES ══════════ */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);
  background:rgba(0,0,0,.15)}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
.data-table thead{background:rgba(78,231,255,.06)}
.data-table th{padding:11px 13px;text-align:right;font-weight:800;
  font-size:11px;letter-spacing:.04em;color:var(--text-2);
  border-bottom:1px solid var(--border-2);white-space:nowrap}
.data-table td{padding:11px 13px;border-bottom:1px solid var(--border);
  color:var(--text-2);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:hover{background:rgba(78,231,255,.03)}
.data-table .name-cell{color:var(--text);font-weight:700}
.data-table .actions{display:flex;gap:5px;flex-wrap:wrap}
.tiny-btn{padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700;
  border:1px solid var(--border-2);background:rgba(255,255,255,.04);
  color:var(--text-2);transition:.2s;white-space:nowrap}
.tiny-btn:hover{background:rgba(78,231,255,.1);color:var(--cyan);border-color:var(--cyan)}
.tiny-btn.danger{border-color:rgba(255,128,128,.3);color:#ffb0b0}
.tiny-btn.danger:hover{background:rgba(255,128,128,.12);border-color:var(--err);color:var(--err)}
.tiny-btn.ok{border-color:rgba(93,242,176,.3);color:#b9ecd8}
.tiny-btn.ok:hover{background:rgba(93,242,176,.12);border-color:var(--ok);color:var(--ok)}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;
  font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.badge-free{background:rgba(140,170,255,.14);color:#b8c4dc;border:1px solid rgba(140,170,255,.3)}
.badge-pro{background:rgba(78,231,255,.14);color:var(--cyan);border:1px solid rgba(78,231,255,.4)}
.badge-enterprise{background:rgba(232,200,122,.14);color:var(--gold);border:1px solid rgba(232,200,122,.4)}
.badge-pending{background:rgba(255,184,77,.14);color:var(--warn);border:1px solid rgba(255,184,77,.35)}
.badge-approved{background:rgba(93,242,176,.14);color:var(--ok);border:1px solid rgba(93,242,176,.35)}
.badge-rejected{background:rgba(255,128,128,.14);color:var(--err);border:1px solid rgba(255,128,128,.35)}
.badge-blocked{background:rgba(255,128,128,.14);color:#ffb0b0;border:1px solid rgba(255,128,128,.35)}

/* ══════════ CHAT (Accountant) ══════════ */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 180px);
  min-height:400px;max-height:780px;border-radius:var(--r-lg);
  overflow:hidden;background:linear-gradient(145deg,rgba(18,26,44,.8),rgba(12,18,32,.6));
  border:1px solid var(--border);box-shadow:var(--shadow)}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;background:rgba(78,231,255,.04)}
.chat-head-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 12px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.chat-head-title{font-size:13px;font-weight:800}
.chat-head-sub{font-size:11px;color:var(--text-3)}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;
  flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{display:flex;gap:9px;max-width:88%;animation:msgIn .3s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-right:auto;flex-direction:row-reverse}
.msg.bot{margin-left:auto}
.msg-avatar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex-shrink:0}
.msg.bot .msg-avatar{background:linear-gradient(135deg,var(--cyan),var(--gold));color:#05080f}
.msg.user .msg-avatar{background:rgba(255,255,255,.08);color:var(--text)}
.msg-bubble{padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.9;
  white-space:pre-wrap;word-break:break-word}
.msg.bot .msg-bubble{background:rgba(78,231,255,.07);border:1px solid var(--border-2);
  border-top-right-radius:4px}
.msg.user .msg-bubble{background:linear-gradient(135deg,rgba(78,231,255,.9),rgba(107,182,255,.9));
  color:#05080f;font-weight:600;border-top-left-radius:4px}
.chat-typing{display:inline-flex;gap:4px;padding:14px 16px}
.chat-typing span{width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--gold));
  animation:typingBounce 1.2s infinite}
.chat-typing span:nth-child(2){animation-delay:.15s}
.chat-typing span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-6px);opacity:1}}
.chat-input-wrap{padding:12px;border-top:1px solid var(--border);
  display:flex;gap:8px;background:rgba(0,0,0,.2)}
.chat-input{flex:1;padding:11px 16px;border-radius:12px;
  background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--text);
  outline:none;resize:none;font-size:13.5px;line-height:1.6;
  max-height:120px;min-height:44px;transition:.25s;font-family:inherit}
.chat-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(78,231,255,.08)}
.chat-send{padding:0 18px;border-radius:12px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan-2));color:#05080f;
  font-weight:800;font-size:13px;transition:.2s;white-space:nowrap}
.chat-send:disabled{opacity:.4;cursor:not-allowed}

/* ══════════ FORECAST ══════════ */
.forecast-scenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;margin:16px 0}
.scenario{padding:16px;border-radius:14px;border:1px solid var(--border);
  background:rgba(0,0,0,.2)}
.scenario.optimistic{border-color:rgba(93,242,176,.3);
  background:linear-gradient(145deg,rgba(93,242,176,.06),transparent)}
.scenario.realistic{border-color:rgba(78,231,255,.3);
  background:linear-gradient(145deg,rgba(78,231,255,.06),transparent)}
.scenario.pessimistic{border-color:rgba(255,128,128,.3);
  background:linear-gradient(145deg,rgba(255,128,128,.06),transparent)}
.scenario-label{font-size:11px;font-weight:700;color:var(--text-3);
  margin-bottom:6px;letter-spacing:.03em}
.scenario-value{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.scenario-desc{font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.7}
.confidence-bar{height:6px;background:rgba(255,255,255,.06);
  border-radius:99px;overflow:hidden;margin:10px 0}
.confidence-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));
  border-radius:99px;transition:width .6s ease}
.reason-list{list-style:none;padding:0;margin:0;display:flex;
  flex-direction:column;gap:8px}
.reason-list li{padding:10px 12px;background:rgba(78,231,255,.04);

.reason-list li::before{content:"›";color:var(--cyan);margin-left:8px;

/* ══════════ SUBSCRIPTION ══════════ */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;margin:20px 0}
.tier-card{padding:24px 20px;border-radius:var(--r-lg);

  border:1px solid var(--border);position:relative;overflow:hidden;
  transition:transform .3s,border-color .3s}
.tier-card:hover{transform:translateY(-4px);border-color:var(--border-2)}
.tier-card.featured{border-color:rgba(232,200,122,.4);
  box-shadow:0 0 50px -10px rgba(232,200,122,.4)}
.tier-card.featured::before{content:"محبوب";position:absolute;top:12px;left:12px;

.tier-card.current{border-color:rgba(78,231,255,.5);

.tier-card.current::after{content:"فعلی";position:absolute;top:12px;left:12px;
  font-size:9.5px;padding:3px 10px;border-radius:99px;font-weight:800;

.tier-name{font-size:12px;letter-spacing:.16em;text-transform:uppercase;

.tier-price small{font-size:12px;font-weight:500;color:var(--text-3)}
.tier-desc{font-size:12px;color:var(--text-3);margin-bottom:16px;line-height:1.85}
.tier-features{list-style:none;padding:0;margin:0 0 16px;

.tier-features li::before{content:"✓";position:absolute;right:0;

/* ══════════ ADMIN ══════════ */

/* ══════════ MODAL ══════════ */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;

  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:420px;padding:24px 22px 20px;border-radius:var(--r-lg);
  background:linear-gradient(165deg,rgba(20,30,60,.97),rgba(9,15,34,.98));
  border:1px solid var(--border-2);box-shadow:0 30px 70px -20px #000;
  animation:modalIn .3s cubic-bezier(.2,.7,.3,1);max-height:90vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.modal-card h3{font-size:16px;font-weight:800;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--text-3);margin-bottom:18px;line-height:1.8}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
.modal-close{position:absolute;top:12px;left:12px;width:30px;height:30px;
  border-radius:8px;font-size:18px;color:var(--text-3);
  display:grid;place-items:center;transition:.2s}
.modal-close:hover{background:rgba(255,255,255,.06);color:var(--text)}

/* ══════════ WELCOME ══════════ */
.welcome-overlay{position:fixed;inset:0;z-index:150;display:grid;place-items:center;
  padding:20px;background:
    radial-gradient(circle at 50% 40%,rgba(78,231,255,.15),transparent 55%),
    radial-gradient(circle at 30% 80%,rgba(232,200,122,.1),transparent 55%),
    rgba(5,8,15,.98);
  animation:welcomeIn .6s ease both}
@keyframes welcomeIn{from{opacity:0}to{opacity:1}}
.welcome-content{text-align:center;max-width:600px;padding:20px}
.welcome-mark{width:90px;height:90px;border-radius:24px;margin:0 auto 24px;
  display:grid;place-items:center;font-size:40px;font-weight:900;color:#05080f;

  box-shadow:0 0 80px rgba(78,231,255,.5);

@keyframes welcomePop{from{transform:scale(.3) rotate(-15deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}}
.welcome-hi{font-size:clamp(26px,6vw,42px);font-weight:800;margin-bottom:14px;
  line-height:1.3;animation:welcomeRise .8s .4s ease both}
.welcome-hi span{background:linear-gradient(135deg,var(--cyan),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.welcome-sub{font-size:15px;color:var(--text-2);margin-bottom:32px;line-height:2;
  animation:welcomeRise .8s .6s ease both}
.welcome-content .btn{padding:14px 40px;font-size:14px;
  animation:welcomeRise .8s .8s ease both}
@keyframes welcomeRise{from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}}

/* ══════════ TOAST ══════════ */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  z-index:300;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;
  background:linear-gradient(135deg,rgba(18,30,62,.98),rgba(10,17,38,.98));

  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(93,242,176,.5);color:#d5fbea}
.toast.error{border-color:rgba(255,128,128,.5);color:#ffd5cc}

/* Utilities */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-between{justify-content:space-between}
.empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px;

</style>
</head>
<body>

<script>
"use strict";

/* ═══════════════════════════════════════════
   NEXORA AI v2 — Single File Application
   ═══════════════════════════════════════════ */

/* ─────────── 1. STORAGE ─────────── */
const STORAGE_KEY = "nexora_v2_data";
const ADMIN_PW = "152831321";

const DB = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        this.data = JSON.parse(raw);
      }
    } catch (e) { console.error("Load failed:", e); }
    if (!this.data || typeof this.data !== "object") {
      this.data = this.blank();
    }
    // Ensure all collections exist
    ["users","subscriptions","transactions","products","priceHistory",
     "activities"].forEach(k => {
      if (!Array.isArray(this.data[k])) this.data[k] = [];
    });
    if (!this.data.settings) this.data.settings = this.defaultSettings();
    if (!this.data.session) this.data.session = null;
    if (!this.data.adminSession) this.data.adminSession = null;
    return this.data;
  },
  blank() {
    return {
      users: [], subscriptions: [], transactions: [], products: [],
      priceHistory: [], activities: [], settings: this.defaultSettings(),
      session: null, adminSession: null
    };
  },
  defaultSettings() {
    return {
      adminReportSchedule: "weekly",
      autoReportsEnabled: false,
      language: "fa",
      animations: true
    };
  },
  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      return true;
    } catch (e) {
      console.error("Save failed:", e);
      return false;
    }
  },
  reset() {
    localStorage.removeItem(STORAGE_KEY);
    this.data = this.blank();
  }
};

/* ─────────── 2. CRYPTO ─────────── */
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}
function genSalt() {
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function hashPassword(pw, salt) {
  return await sha256("nexora::v2::" + salt + "::" + pw);
}
let ADMIN_HASH = null;
async function initAdminHash() {
  ADMIN_HASH = await sha256("nexora::admin::v2::" + ADMIN_PW);
}

/* ─────────── 3. UTILITIES ─────────── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = (p) => (p || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmtNum(n) {
  if (n == null || isNaN(n)) return "—";
  try { return Number(n).toLocaleString("fa-IR"); }
  catch (e) { return String(n); }
}
function fmtMoney(n) { return fmtNum(n) + " تومان"; }
function fmtDate(ts) {
  if (!ts) return "—";
  try {
    return new Date(ts).toLocaleDateString("fa-IR",
      { year: "numeric", month: "2-digit", day: "2-digit" });
  } catch (e) { return "—"; }
}
function fmtDateTime(ts) {
  if (!ts) return "—";
  try {
    return new Date(ts).toLocaleString("fa-IR",
      { year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit" });
  } catch (e) { return "—"; }
}
function todayKey() { return new Date().toISOString().slice(0, 10); }

/* ─────────── 4. TOAST ─────────── */
let _toastTimer = null;
function toast(msg, type) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.className = "toast show" + (type ? " " + type : "");
  el.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { el.hidden = true; }, 320);
  }, 2400);
}

/* ─────────── 5. MODAL HELPERS ─────────── */
function openModal(id) { const el = $("#" + id); if (el) el.hidden = false; }
function closeModal(id) { const el = $("#" + id); if (el) el.hidden = true; }
function openGenericModal(html) {
  const c = $("#genericModalCard");
  c.innerHTML = html;
  openModal("genericModal");
}
function closeGenericModal() { closeModal("genericModal"); }

/* ─────────── 6. AUTH ENGINE ─────────── */
const Auth = {
  currentUser() {
    if (!DB.data.session) return null;
    const u = DB.data.users.find(x => x.id === DB.data.session.userId);
    if (!u) { DB.data.session = null; DB.save(); return null; }
    if (u.blocked) return null;
    return u;
  },
  isLoggedIn() { return !!this.currentUser(); },
  async register(name, email, password) {
    name = String(name || "").trim();
    email = String(email || "").trim().toLowerCase();
    if (name.length < 2) return { ok: false, error: "نام باید حداقل ۲ حرف باشد" };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { ok: false, error: "ایمیل معتبر نیست" };
    if (password.length < 6) return { ok: false, error: "رمز عبور باید حداقل ۶ کاراکتر باشد" };
    if (DB.data.users.some(u => u.email === email)) return { ok: false, error: "این ایمیل قبلاً ثبت شده است" };
    const salt = genSalt();
    const passwordHash = await hashPassword(password, salt);
    const user = {
      id: uid("u"), email, name, passwordHash, salt,
      role: "user", tier: "free", tierExpiresAt: null,
      blocked: false, createdAt: Date.now(), lastLogin: Date.now()
    };
    DB.data.users.push(user);
    DB.data.session = { userId: user.id, ts: Date.now() };
    this.logActivity(user.id, "signup", "ثبت‌نام در پلتفرم");
    DB.save();
    return { ok: true, user };
  },
  async login(email, password) {
    email = String(email || "").trim().toLowerCase();
    const user = DB.data.users.find(u => u.email === email);
    if (!user) return { ok: false, error: "ایمیل یا رمز عبور اشتباه است" };
    if (user.blocked) return { ok: false, error: "حساب شما مسدود شده است" };
    const hash = await hashPassword(password, user.salt);
    if (hash !== user.passwordHash) return { ok: false, error: "ایمیل یا رمز عبور اشتباه است" };
    user.lastLogin = Date.now();
    DB.data.session = { userId: user.id, ts: Date.now() };
    this.logActivity(user.id, "login", "ورود به حساب");
    DB.save();
    return { ok: true, user };
  },
  logout() {
    const u = this.currentUser();
    if (u) this.logActivity(u.id, "logout", "خروج از حساب");
    DB.data.session = null;
    DB.save();
  },
  async changePassword(currentPw, newPw) {
    const user = this.currentUser();
    if (!user) return { ok: false, error: "ابتدا وارد شوید" };
    const currentHash = await hashPassword(currentPw, user.salt);
    if (currentHash !== user.passwordHash) return { ok: false, error: "رمز فعلی اشتباه است" };
    if (newPw.length < 6) return { ok: false, error: "رمز جدید باید حداقل ۶ کاراکتر باشد" };
    user.salt = genSalt();
    user.passwordHash = await hashPassword(newPw, user.salt);
    DB.save();
    return { ok: true };
  },
  logActivity(userId, type, detail) {
    DB.data.activities.push({
      id: uid("a"), userId, type, detail, createdAt: Date.now()
    });
    if (DB.data.activities.length > 1000) {
      DB.data.activities = DB.data.activities.slice(-1000);
    }
  }
};

/* ─────────── 7. ADMIN ENGINE ─────────── */
const Admin = {
  secretClicks: 0,
  secretTimer: null,
  loginAttempts: { count: 0, until: 0 },

  isLoggedIn() {
    const s = DB.data.adminSession;
    if (!s) return false;
    if (Date.now() - s.ts > 12 * 3600000) {
      DB.data.adminSession = null;
      DB.save();
      return false;
    }
    return true;
  },
  setSession() {
    DB.data.adminSession = { ts: Date.now() };
    DB.save();
  },
  clearSession() {
    DB.data.adminSession = null;
    DB.save();
  },
  async verifyPassword(pw) {
    if (!ADMIN_HASH) await initAdminHash();
    const hash = await sha256("nexora::admin::v2::" + pw);
    return hash === ADMIN_HASH;
  },
  registerSecretClick(onThreshold) {
    this.secretClicks++;
    clearTimeout(this.secretTimer);
    this.secretTimer = setTimeout(() => { this.secretClicks = 0; }, 5000);
    if (this.secretClicks >= 40) {
      this.secretClicks = 0;
      clearTimeout(this.secretTimer);
      onThreshold();
    }
  },
  stats() {
    const now = Date.now();
    const day7 = now - 7 * 86400000;
    const users = DB.data.users;
    const approved = DB.data.subscriptions.filter(s => s.status === "approved");
    const revenue = approved.reduce((sum, s) => sum + (s.amount || 0), 0);
    return {
      totalUsers: users.length,
      newUsers: users.filter(u => u.createdAt >= day7).length,
      activeUsers: users.filter(u => u.lastLogin >= day7).length,
      subscribedUsers: new Set(approved.map(s => s.userId)).size,
      unsubscribedUsers: users.filter(u => u.tier === "free").length,
      pendingSubs: DB.data.subscriptions.filter(s => s.status === "pending").length,
      revenue,
      totalTx: DB.data.transactions.length
    };
  }
};

/* ─────────── 8. DATA ENGINE ─────────── */
const Data = {
  addTransaction(tx) {
    const u = Auth.currentUser();
    if (!u) return { ok: false, error: "ابتدا وارد شوید" };
    if (!["income", "expense"].includes(tx.type)) return { ok: false, error: "نوع نامعتبر" };
    const amount = parseInt(tx.amount, 10);
    if (!Number.isFinite(amount) || amount <= 0) return { ok: false, error: "مبلغ باید مثبت باشد" };
    const t = {
      id: uid("t"), userId: u.id, type: tx.type, amount,
      category: (tx.category || "").trim() || null,
      description: (tx.description || "").trim() || null,
      createdAt: Date.now()
    };
    DB.data.transactions.push(t);
    Auth.logActivity(u.id, "transaction",
      (tx.type === "income" ? "درآمد" : "هزینه") + ": " + fmtMoney(amount));
    DB.save();
    return { ok: true, transaction: t };
  },
  userTransactions(userId, days) {
    const since = days ? Date.now() - days * 86400000 : 0;
    return DB.data.transactions
      .filter(t => t.userId === userId && t.createdAt >= since)
      .sort((a, b) => b.createdAt - a.createdAt);
  },
  deleteTransaction(id) {
    const u = Auth.currentUser();
    if (!u) return false;
    const idx = DB.data.transactions.findIndex(t => t.id === id && t.userId === u.id);
    if (idx === -1) return false;
    DB.data.transactions.splice(idx, 1);
    DB.save();
    return true;
  },
  addProduct(p) {
    const u = Auth.currentUser();
    if (!u) return { ok: false, error: "ابتدا وارد شوید" };
    const name = String(p.name || "").trim();
    if (name.length < 2) return { ok: false, error: "نام باید حداقل ۲ حرف باشد" };
    const buyPrice = parseInt(p.buyPrice, 10) || 0;
    const sellPrice = parseInt(p.sellPrice, 10) || 0;
    const stock = parseFloat(p.stock) || 0;
    if (buyPrice < 0 || sellPrice < 0 || stock < 0) return { ok: false, error: "مقادیر منفی مجاز نیست" };
    const prod = {
      id: uid("p"), userId: u.id, name, buyPrice, sellPrice, stock,
      updatedAt: Date.now()
    };
    DB.data.products.push(prod);
    DB.data.priceHistory.push({
      id: uid("ph"), productId: prod.id, buyPrice, sellPrice,
      recordedAt: Date.now()
    });
    Auth.logActivity(u.id, "product_add", "کالای جدید: " + name);
    DB.save();
    return { ok: true, product: prod };
  },
  userProducts(userId) {
    return DB.data.products.filter(p => p.userId === userId);
  },
  updateProduct(id, patch) {
    const u = Auth.currentUser();
    if (!u) return false;
    const p = DB.data.products.find(x => x.id === id && x.userId === u.id);
    if (!p) return false;
    const oldBuy = p.buyPrice, oldSell = p.sellPrice;
    if (patch.buyPrice != null) p.buyPrice = parseInt(patch.buyPrice, 10) || 0;
    if (patch.sellPrice != null) p.sellPrice = parseInt(patch.sellPrice, 10) || 0;
    if (patch.stock != null) p.stock = parseFloat(patch.stock) || 0;
    p.updatedAt = Date.now();
    if (p.buyPrice !== oldBuy || p.sellPrice !== oldSell) {
      DB.data.priceHistory.push({
        id: uid("ph"), productId: p.id, buyPrice: p.buyPrice,
        sellPrice: p.sellPrice, recordedAt: Date.now()
      });
    }
    DB.save();
    return true;
  },
  deleteProduct(id) {
    const u = Auth.currentUser();
    if (!u) return false;
    const idx = DB.data.products.findIndex(p => p.id === id && p.userId === u.id);
    if (idx === -1) return false;
    const pid = DB.data.products[idx].id;
    DB.data.products.splice(idx, 1);
    DB.data.priceHistory = DB.data.priceHistory.filter(h => h.productId !== pid);
    DB.save();
    return true;
  },
  requestSubscription(tier, receiptData) {
    const u = Auth.currentUser();
    if (!u) return { ok: false, error: "ابتدا وارد شوید" };
    const TIERS = { pro: { price: 299000 }, enterprise: { price: 999000 } };
    if (!TIERS[tier]) return { ok: false, error: "سطح نامعتبر" };
    const pending = DB.data.subscriptions.find(
      s => s.userId === u.id && s.status === "pending"
    );
    if (pending) return { ok: false, error: "شما یک درخواست در انتظار تأیید دارید" };
    if (!receiptData) return { ok: false, error: "تصویر رسید الزامی است" };
    const sub = {
      id: uid("s"), userId: u.id, tier, status: "pending",
      amount: TIERS[tier].price, receipt: receiptData,
      requestedAt: Date.now(), reviewedAt: null
    };
    DB.data.subscriptions.push(sub);
    Auth.logActivity(u.id, "sub_request", "درخواست اشتراک " + tier);
    DB.save();
    return { ok: true, subscription: sub };
  },
  mySubscriptions(userId) {
    return DB.data.subscriptions
      .filter(s => s.userId === userId)
      .sort((a, b) => b.requestedAt - a.requestedAt);
  },
  approveSubscription(id) {
    const sub = DB.data.subscriptions.find(s => s.id === id);
    if (!sub || sub.status !== "pending") return { ok: false, error: "درخواست معتبر نیست" };
    sub.status = "approved";
    sub.reviewedAt = Date.now();
    const user = DB.data.users.find(u => u.id === sub.userId);
    if (user) {
      user.tier = sub.tier;
      user.tierExpiresAt = Date.now() + 30 * 86400000;
    }
    Auth.logActivity(sub.userId, "sub_approved", "اشتراک " + sub.tier + " تأیید شد");
    DB.save();
    return { ok: true };
  },
  rejectSubscription(id, note) {
    const sub = DB.data.subscriptions.find(s => s.id === id);
    if (!sub || sub.status !== "pending") return { ok: false, error: "درخواست معتبر نیست" };
    sub.status = "rejected";
    sub.reviewedAt = Date.now();
    sub.adminNote = note || null;
    Auth.logActivity(sub.userId, "sub_rejected", "درخواست اشتراک رد شد");
    DB.save();
    return { ok: true };
  },
  cancelUserSubscription(userId) {
    const user = DB.data.users.find(u => u.id === userId);
    if (!user) return false;
    user.tier = "free";
    user.tierExpiresAt = null;
    DB.data.subscriptions.forEach(s => {
      if (s.userId === userId && s.status === "approved") {
        s.status = "cancelled";
        s.reviewedAt = Date.now();
      }
    });
    Auth.logActivity(userId, "sub_cancelled", "لغو اشتراک توسط مدیر");
    DB.save();
    return true;
  },
  toggleBlock(userId) {
    const user = DB.data.users.find(u => u.id === userId);
    if (!user) return false;
    user.blocked = !user.blocked;
    DB.save();
    return true;
  },
  changeTier(userId, tier) {
    const user = DB.data.users.find(u => u.id === userId);
    if (!user) return false;
    user.tier = tier;
    user.tierExpiresAt = tier === "free" ? null : Date.now() + 30 * 86400000;
    Auth.logActivity(userId, "tier_change", "تغییر سطح به " + tier + " توسط مدیر");
    DB.save();
    return true;
  }
};

/* ─────────── 9. ACCOUNTANT ENGINE ─────────── */
const Accountant = {
  parseAmounts(text) {
    const map = { "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5",
      "۶":"6","۷":"7","۸":"8","۹":"9","٠":"0","١":"1","٢":"2","٣":"3",
      "٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9" };
    let t = String(text || "").replace(/[۰-۹٠-٩]/g, d => map[d]).replace(/,/g, " ");
    const results = [];
    const re = /(\d+(?:\.\d+)?)\s*(هزار|میلیون|میلیارد|تومان|ریال)?/gi;
    let m;
    while ((m = re.exec(t)) !== null) {
      let n = parseFloat(m[1]);
      const u = (m[2] || "").toLowerCase();
      if (u === "هزار") n *= 1000;
      else if (u === "میلیون") n *= 1000000;
      else if (u === "میلیارد") n *= 1000000000;
      if (n >= 1000) results.push(n);
    }
    return results;
  },
  getContext(userId, days) {
    days = days || 30;
    const txs = Data.userTransactions(userId, days);
    const prods = Data.userProducts(userId);
    let income = 0, expense = 0;
    txs.forEach(t => t.type === "income" ? income += t.amount : expense += t.amount);
    const profit = income - expense;
    const margin = income > 0 ? (profit / income) * 100 : 0;
    return { income, expense, profit, margin, txCount: txs.length, prods };
  },
  respond(userId, message) {
    const text = String(message || "").trim();
    if (!text) return "پیام خالی است.";

    const amounts = this.parseAmounts(text);
    const ctx = this.getContext(userId);

    // Two amounts => buy/sell analysis
    if (amounts.length >= 2) {
      const buy = amounts[0];
      const sell = amounts[1];
      if (buy > 0 && sell > 0) {
        const profitPerUnit = sell - buy;
        const margin = (profitPerUnit / sell) * 100;
        const markup = (profitPerUnit / buy) * 100;
        let verdict = "";
        let emoji = "";
        if (profitPerUnit < 0) { verdict = "شما در این معامله در ضرر هستید. قیمت فروش پایین‌تر از قیمت خرید است."; emoji = "🔴"; }
        else if (margin < 10) { verdict = "حاشیه سود شما پایین است. با احتساب هزینه‌های جانبی، ممکن است به مرز ضرر نزدیک شوید."; emoji = "🟡"; }
        else if (margin < 25) { verdict = "حاشیه سود شما قابل قبول است، اما فضای بهبود وجود دارد."; emoji = "🟢"; }
        else if (margin < 50) { verdict = "حاشیه سود شما خوب است. این معامله را در اولویت قرار دهید."; emoji = "🌟"; }
        else { verdict = "حاشیه سود شما بسیار بالاست. اگر فروش ادامه دارد، این محصول را تقویت کنید."; emoji = "💎"; }

        let analysis = emoji + " تحلیل معامله:\n\n";
        analysis += "• قیمت خرید: " + fmtMoney(buy) + "\n";
        analysis += "• قیمت فروش: " + fmtMoney(sell) + "\n";
        analysis += "• سود هر واحد: " + fmtMoney(profitPerUnit) + "\n";
        analysis += "• حاشیه سود: " + margin.toFixed(1) + "٪\n";
        analysis += "• نرخ افزایش نسبت به خرید: " + markup.toFixed(1) + "٪\n\n";
        analysis += verdict;

        if (ctx.txCount > 0) {
          analysis += "\n\n📊 در " + "۳۰ روز گذشته:\n";
          analysis += "• درآمد: " + fmtMoney(ctx.income) + "\n";
          analysis += "• هزینه: " + fmtMoney(ctx.expense) + "\n";
          analysis += "• سود خالص: " + fmtMoney(ctx.profit) + "\n";
          analysis += "• حاشیه کل: " + ctx.margin.toFixed(1) + "٪";
        } else {
          analysis += "\n\nℹ️ برای تحلیل جامع‌تر، تراکنش‌های درآمد و هزینه خود را نیز در بخش «تراکنش‌ها» ثبت کنید.";
        }

        return analysis;
      }
    }

    // Compare products
    if (/مقایسه|کدام|بهترین|پرسودترین|بیشترین/.test(text) && ctx.prods.length >= 2) {
      const list = ctx.prods.map(p => ({
        name: p.name,
        margin: p.sellPrice > 0 ? ((p.sellPrice - p.buyPrice) / p.sellPrice * 100) : 0,
        profit: p.sellPrice - p.buyPrice
      })).sort((a, b) => b.margin - a.margin);

      let r = "🔍 مقایسه کالاها بر اساس حاشیه سود:\n\n";
      list.forEach((p, i) => {
        r += (i + 1) + ". " + p.name + "\n";
        r += "   حاشیه: " + p.margin.toFixed(1) + "٪ · سود هر واحد: " + fmtMoney(p.profit) + "\n";
      });
      r += "\n💡 توصیه: کالاهای با حاشیه بالاتر را در اولویت فروش قرار دهید، اما توجه کنید که سرعت فروش هم مهم است.";
      return r;
    }

    // Inventory
    if (/موجودی|انبار|انبارداری|کالا|محصول/.test(text)) {
      if (ctx.prods.length === 0) {
        return "📦 هنوز هیچ کالایی ثبت نکرده‌اید.\n\nاز بخش «کالاها» می‌توانید نام، قیمت خرید، قیمت فروش و موجودی هر کالا را وارد کنید تا تحلیل دقیق‌تری دریافت کنید.";
      }
      let r = "📦 وضعیت موجودی انبار:\n\n";
      let totalStockValue = 0;
      let lowStock = [];
      ctx.prods.forEach(p => {
        const margin = p.sellPrice > 0 ? ((p.sellPrice - p.buyPrice) / p.sellPrice * 100) : 0;
        totalStockValue += p.buyPrice * p.stock;
        r += "• " + p.name + ": " + p.stock + " واحد · حاشیه " + margin.toFixed(1) + "٪\n";
        if (p.stock < 3) lowStock.push(p.name);
      });
      r += "\n💰 ارزش موجودی (به قیمت خرید): " + fmtMoney(totalStockValue) + "\n";
      if (lowStock.length > 0) {
        r += "\n⚠️ کالاهای با موجودی کم: " + lowStock.join("، ");
      }
      return r;
    }

    // Overall status
    if (/وضعیت|چطور|چگونه|تحلیل|خلاصه|گزارش|سود|زیان|درآمد|هزینه/.test(text)) {
      if (ctx.txCount === 0) {
        return "برای تحلیل وضعیت، ابتدا تراکنش‌های درآمد و هزینه خود را در بخش «تراکنش‌ها» ثبت کنید.\n\nحداقل به ۳ تراکنش نیاز است تا بتوانم تحلیل دقیق‌تری ارائه دهم.";
      }
      let health, healthEmoji;
      if (ctx.profit < 0) { health = "کسب‌وکار شما در حال ضرر است"; healthEmoji = "🔴"; }
      else if (ctx.margin < 10) { health = "حاشیه سود شما پایین است"; healthEmoji = "🟡"; }
      else if (ctx.margin < 30) { health = "وضعیت متعادل است"; healthEmoji = "🟢"; }
      else { health = "حاشیه سود شما بسیار خوب است"; healthEmoji = "🌟"; }

      let r = healthEmoji + " گزارش ۳۰ روز گذشته:\n\n";
      r += "• تعداد تراکنش: " + fmtNum(ctx.txCount) + "\n";
      r += "• کل درآمد: " + fmtMoney(ctx.income) + "\n";
      r += "• کل هزینه: " + fmtMoney(ctx.expense) + "\n";
      r += "• سود خالص: " + fmtMoney(ctx.profit) + "\n";
      r += "• حاشیه سود: " + ctx.margin.toFixed(1) + "٪\n\n";
      r += health;

      if (ctx.expense > 0 && ctx.income > 0) {
        const ratio = (ctx.expense / ctx.income) * 100;
        r += "\n\n• نسبت هزینه به درآمد: " + ratio.toFixed(1) + "٪";
        if (ratio > 80) r += "\n⚠️ نسبت هزینه به درآمد بسیار بالاست.";
        else if (ratio > 60) r += "\n⚠️ بهتر است هزینه‌های غیرضروری را بازبینی کنید.";
      }
      return r;
    }

    // Advice
    if (/پیشنهاد|چه کنم|راهنما|راهکار|بهتر|بهبود/.test(text)) {
      const tips = [];
      if (ctx.txCount === 0) {
        tips.push("ابتدا تراکنش‌های مالی خود را ثبت کنید.");
        tips.push("کالاهای خود را با قیمت خرید و فروش در بخش «کالاها» اضافه کنید.");
      } else {
        if (ctx.profit < 0) tips.push("کسب‌وکار در ضرر است. هزینه‌های غیرضروری را کاهش دهید و روی محصولات پرفروش تمرکز کنید.");
        if (ctx.margin < 20 && ctx.margin >= 0) tips.push("حاشیه سود پایین است. با مذاکره با تأمین‌کننده یا افزایش قیمت تدریجی، حاشیه را بهبود دهید.");
        if (ctx.expense > 0 && ctx.income > 0 && ctx.expense / ctx.income > 0.7) {
          tips.push("نسبت هزینه به درآمد بالاست. دسته‌بندی هزینه‌ها را بررسی و موارد غیرضروری را حذف کنید.");
        }
        if (ctx.profit > 0) tips.push("وضعیت مثبت است. سود را صرف بازاریابی یا تنوع محصول کنید.");
      }
      tips.push("قیمت‌ها را به‌روز نگه دارید تا تحلیل‌ها دقیق‌تر شوند.");

      let r = "💡 پیشنهادهای کاربردی:\n\n";
      tips.forEach((t, i) => { r += (i + 1) + ". " + t + "\n\n"; });
      return r.trim();
    }

    // Default
    return "سلام! من حسابدار هوشمند شما هستم. می‌توانم در این موارد کمک کنم:\n\n" +
      "• تحلیل معامله — مثلاً: «خرید ۲۰۰ هزار، فروش ۲۷۰ هزار»\n" +
      "• گزارش وضعیت — «وضعیت من چطور است؟»\n" +
      "• بررسی انبار — «موجودی انبار»\n" +
      "• مقایسه کالاها — «کالاها را مقایسه کن»\n" +
      "• دریافت پیشنهاد — «چه کنم بهتر شود؟»";
  }
};

/* ─────────── 10. FORECAST ENGINE ─────────── */
const Forecast = {
  linearRegression(points) {
    const n = points.length;
    if (n < 2) return null;
    let sx = 0, sy = 0, sxy = 0, sxx = 0;
    points.forEach(p => {
      sx += p.x; sy += p.y; sxy += p.x * p.y; sxx += p.x * p.x;
    });
    const d = n * sxx - sx * sx;
    if (d === 0) return { slope: 0, intercept: sy / n, r2: 0 };
    const slope = (n * sxy - sx * sy) / d;
    const intercept = (sy - slope * sx) / n;
    const meanY = sy / n;
    let ssRes = 0, ssTot = 0;
    points.forEach(p => {
      const pred = slope * p.x + intercept;
      ssRes += Math.pow(p.y - pred, 2);
      ssTot += Math.pow(p.y - meanY, 2);
    });
    const r2 = ssTot === 0 ? 0 : Math.max(0, 1 - ssRes / ssTot);
    return { slope, intercept, r2 };
  },
  generate(userId, days) {
    days = days || 30;
    const txs = Data.userTransactions(userId, days);
    if (txs.length < 3) {
      return {
        ok: false,
        message: "برای پیش‌بینی، حداقل ۳ تراکنش در " + fmtNum(days) +
          " روز گذشته نیاز است. اکنون " + fmtNum(txs.length) + " تراکنش ثبت شده.",
        dataPoints: txs.length
      };
    }

    // Bucket by day
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const buckets = {};
    for (let i = 0; i < days; i++) {
      const d = new Date(today.getTime() - (days - 1 - i) * 86400000);
      buckets[d.toISOString().slice(0, 10)] = { income: 0, expense: 0 };
    }
    txs.forEach(t => {
      const key = new Date(t.createdAt).toISOString().slice(0, 10);
      if (!buckets[key]) return;
      if (t.type === "income") buckets[key].income += t.amount;
      else buckets[key].expense += t.amount;
    });

    const keys = Object.keys(buckets).sort();
    const incPts = keys.map((k, i) => ({ x: i, y: buckets[k].income }));
    const expPts = keys.map((k, i) => ({ x: i, y: buckets[k].expense }));
    const incR = this.linearRegression(incPts);
    const expR = this.linearRegression(expPts);

    let projInc = 0, projExp = 0;
    for (let i = 0; i < 30; i++) {
      projInc += Math.max(0, incR.slope * (days + i) + incR.intercept);
      projExp += Math.max(0, expR.slope * (days + i) + expR.intercept);
    }

    const totalInc = incPts.reduce((a, p) => a + p.y, 0);
    const totalExp = expPts.reduce((a, p) => a + p.y, 0);
    const netProfit = totalInc - totalExp;

    const avgR2 = (incR.r2 + expR.r2) / 2;
    const confidence = Math.min(95, Math.max(25, Math.round(avgR2 * 100)));

    const reasons = [];
    if (incR.slope > 1000) reasons.push("روند درآمد صعودی است (به‌طور میانگین " + fmtMoney(Math.round(incR.slope)) + " در روز افزایش).");
    else if (incR.slope < -1000) reasons.push("روند درآمد نزولی است (به‌طور میانگین " + fmtMoney(Math.round(-incR.slope)) + " در روز کاهش).");
    else reasons.push("روند درآمد تقریباً ثابت است.");

    if (expR.slope > 1000) reasons.push("روند هزینه صعودی است (به‌طور میانگین " + fmtMoney(Math.round(expR.slope)) + " در روز افزایش).");
    else if (expR.slope < -1000) reasons.push("روند هزینه نزولی است (به‌طور میانگین " + fmtMoney(Math.round(-expR.slope)) + " در روز کاهش).");
    else reasons.push("روند هزینه تقریباً ثابت است.");

    if (netProfit > 0) reasons.push("در دوره گذشته سود خالص مثبت بوده است.");
    else if (netProfit < 0) reasons.push("در دوره گذشته ضرر ثبت شده است.");

    const limitations = [];
    if (txs.length < 10) limitations.push("تعداد تراکنش‌ها کم است (" + fmtNum(txs.length) + " مورد).");
    if (avgR2 < 0.5) limitations.push("پراکندگی داده‌ها بالاست؛ پیش‌بینی قطعی نیست.");
    if (totalInc === 0) limitations.push("درآمدی در دوره ثبت نشده.");
    if (limitations.length === 0) limitations.push("پیش‌بینی بر اساس روند خطی داده‌های گذشته است.");

    return {
      ok: true,
      dataPoints: txs.length,
      period: days,
      history: {
        totalIncome: totalInc,
        totalExpense: totalExp,
        netProfit,
        avgDailyIncome: Math.round(totalInc / days),
        avgDailyExpense: Math.round(totalExp / days)
      },
      forecast: {
        projectedIncome: Math.round(projInc),
        projectedExpense: Math.round(projExp),
        projectedProfit: Math.round(projInc - projExp),
        optimistic: Math.round(projInc * 1.2 - projExp * 0.9),
        pessimistic: Math.round(projInc * 0.8 - projExp * 1.15),
        confidence,
        reasons,
        limitations
      }
    };
  }
};

/* ─────────── 11. IMAGE COMPRESSION ─────────── */
function compressImage(file, maxSize) {
  maxSize = maxSize || 1000;
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) {
      reject(new Error("فقط فایل تصویری مجاز است"));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const ratio = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => reject(new Error("فایل تصویری معتبر نیست"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("خطا در خواندن فایل"));
    reader.readAsDataURL(file);
  });
}

const ADMIN_ROUTE2 = { id: "admin-reports", icon: "✎", label: "گزارش‌ها" };

function renderNav() {
  const isAdmin = Admin.isLoggedIn();

    '" data-route="' + r.id + '"><i>' + r.icon + '</i><span>' + r.label + '</span></button>'
  ).join("");

  $$("[data-route]").forEach(b => {
    b.addEventListener("click", () => navigate(b.dataset.route));
  });

function navigate(route) {
  if (!Auth.isLoggedIn()) return;
  const isAdmin = Admin.isLoggedIn();
  const adminRoutes = ["admin", "admin-reports"];
  if (adminRoutes.includes(route) && !isAdmin) {
    toast("دسترسی مدیریتی لازم است", "error");
    return;
  }
  if (!isAdmin && adminRoutes.includes(currentRoute)) currentRoute = "dashboard";
  currentRoute = route;
  renderNav();
  renderPage();
}

function renderPage() {
  const user = Auth.currentUser();
  if (!user) return;
  const c = $("#pageContent");
  const renderers = {
    dashboard: renderDashboard,
    accountant: renderAccountant,
    forecast: renderForecast,
    products: renderProducts,
    transactions: renderTransactions,
    subscription: renderSubscription,
    settings: renderSettings,
    admin: renderAdmin,
    "admin-reports": renderAdminReports
  };
  const fn = renderers[currentRoute] || renderDashboard;
  c.innerHTML = "";
  fn(c, user);
  updateUserChip(user);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateUserChip(user) {
  $("#userAvatar").textContent = (user.name || "U").charAt(0).toUpperCase();
  $("#userName").textContent = user.name;
  const tierLabel = { free: "Free", pro: "Pro", enterprise: "Enterprise" }[user.tier] || "Free";

      "من حسابدار هوشمند شما هستم. می‌توانم در تحلیل معاملات، بررسی موجودی، " +
      "محاسبه سود و ارائه پیشنهاد کمکتان کنم.\n\n" +
      "برای شروع، یکی از این‌ها را امتحان کنید:\n" +
      "• «خرید ۲۰۰ هزار، فروش ۲۷۰ هزار»\n" +
      "• «وضعیت من چطور است؟»\n" +
      "• «موجودی انبار»\n" +
      "• «چه کنم بهتر شود؟»");
  } else {
    addBotMessage(body,
      "سلام دوباره " + user.name + " 👋\n\n" +
      "چه سؤالی درباره کسب‌وکارتان دارید؟");
  }

  const send = $("#chatSend");

    const text = input.value.trim();
    if (!text) return;
    addUserMessage(body, text);
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;

    const typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = '<div class="msg-avatar">N</div>' +
      '<div class="msg-bubble chat-typing"><span></span><span></span><span></span></div>';
    body.appendChild(typing);
    body.scrollTop = body.scrollHeight;

    setTimeout(() => {
      typing.remove();
      try {
        const reply = Accountant.respond(user.id, text);
        addBotMessage(body, reply);
        Auth.logActivity(user.id, "accountant_chat", text.slice(0, 100));
        DB.save();
      } catch (e) {
        console.error(e);
        addBotMessage(body, "متأسفانه خطایی رخ داد. لطفاً دوباره تلاش کنید.");
      }
      send.disabled = false;
    }, 500);
  }

  send.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
  setTimeout(() => input.focus(), 100);
}

function showSubscriptionRequestModal(tierKey, tierInfo) {
  openGenericModal(`
    <button class="modal-close" id="modalCloseBtn">×</button>
    <h3>درخواست اشتراک ${tierInfo.label}</h3>
    <p class="modal-sub">مبلغ قابل پرداخت: ${fmtNum(tierInfo.price)} تومان (۳۰ روز)</p>
    <p style="font-size:12.5px;color:var(--text-2);line-height:1.9;margin-bottom:16px">
      لطفاً تصویر رسید پرداخت خود را آپلود کنید. پس از بررسی توسط مدیر،
      اشتراک شما فعال خواهد شد.
    </p>
    <div class="field">
      <label>تصویر رسید</label>
      <input type="file" id="receiptFile" accept="image/*" required>
      <div class="field-hint">فرمت مجاز: JPG، PNG، WebP · حداکثر ۵ مگابایت</div>
    </div>
    <div id="receiptPreviewWrap" hidden>
      <img id="receiptPreviewImg" class="receipt-preview" alt="پیش‌نمایش">
    </div>
    <div class="auth-error" id="subError" hidden></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="subCancel">انصراف</button>
      <button type="button" class="btn btn-primary" id="subSubmit">ثبت درخواست</button>
    </div>
  `);

  let compressedData = null;
  $("#modalCloseBtn").addEventListener("click", closeGenericModal);
  $("#subCancel").addEventListener("click", closeGenericModal);

  $("#receiptFile").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) { compressedData = null; $("#receiptPreviewWrap").hidden = true; return; }
    if (file.size > 5 * 1024 * 1024) {
      const err = $("#subError");
      err.textContent = "حجم فایل بیشتر از ۵ مگابایت است";
      err.hidden = false;
      e.target.value = "";
      compressedData = null;
      return;
    }
    try {
      compressedData = await compressImage(file, 1000);
      $("#receiptPreviewImg").src = compressedData;
      $("#receiptPreviewWrap").hidden = false;
      $("#subError").hidden = true;
    } catch (err) {
      const er = $("#subError");
      er.textContent = err.message || "خطا در پردازش تصویر";
      er.hidden = false;
    }
  });

  $("#subSubmit").addEventListener("click", () => {
    if (!compressedData) {
      const err = $("#subError");
      err.textContent = "لطفاً تصویر رسید را آپلود کنید";
      err.hidden = false;
      return;
    }
    const result = Data.requestSubscription(tierKey, compressedData);
    if (!result.ok) {
      const err = $("#subError");
      err.textContent = result.error;
      err.hidden = false;
      return;
    }
    closeGenericModal();
    toast("درخواست شما ثبت شد و در انتظار بررسی است", "success");
    renderPage();
  });
}

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nexora-backup-" + Date.now() + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast("فایل خروجی دانلود شد", "success");
    } catch (e) {
      toast("خطا در خروجی", "error");
    }
  });

  $("#importFile").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed.data || !parsed.data.users) {
        toast("فایل معتبر نیست", "error");
        return;
      }
      if (!confirm("داده‌های فعلی جایگزین خواهند شد. ادامه؟")) return;
      DB.data = parsed.data;
      DB.save();
      toast("داده‌ها بازیابی شدند. لطفاً دوباره وارد شوید.", "success");
      setTimeout(() => location.reload(), 1500);
    } catch (err) {
      toast("خطا در خواندن فایل", "error");
    }
  });

  $("#wipeBtn").addEventListener("click", () => {
    if (!confirm("تمام داده‌ها حذف می‌شوند. ادامه؟")) return;
    if (!confirm("این عمل قابل بازگشت نیست. مطمئن هستید؟")) return;
    DB.reset();
    toast("همه داده‌ها حذف شد");
    setTimeout(() => location.reload(), 1200);
  });
}

/* ─────────── 22. AUTH UI ─────────── */
let authMode = "login";

function setAuthMode(mode) {
  authMode = mode;
  $$(".auth-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.mode === mode);
  });
  $("#authNameField").hidden = mode !== "signup";
  $("#authPassword").autocomplete = mode === "signup" ? "new-password" : "current-password";
  $("#authSubmit").textContent = mode === "signup" ? "ساخت حساب" : "ورود به حساب";
  $("#authError").hidden = true;
}

function showAuthError(msg) {
  const el = $("#authError");
  el.textContent = msg;
  el.hidden = false;
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const email = $("#authEmail").value;
  const password = $("#authPassword").value;
  const name = $("#authName").value;
  const submitBtn = $("#authSubmit");
  submitBtn.disabled = true;
  submitBtn.textContent = "در حال پردازش…";
  try {
    let result;
    if (authMode === "signup") {
      result = await Auth.register(name, email, password);
    } else {
      result = await Auth.login(email, password);
    }
    if (!result.ok) {
      showAuthError(result.error);
      submitBtn.disabled = false;
      setAuthMode(authMode);
      return;
    }
    // Success
    const user = result.user;
    $("#authForm").reset();
    $("#authScreen").hidden = true;
    showWelcome(user);
  } catch (err) {
    console.error(err);
    showAuthError("خطای غیرمنتظره. لطفاً دوباره تلاش کنید.");
    submitBtn.disabled = false;
    setAuthMode(authMode);
  }
}

function showWelcome(user) {
  $("#welcomeName").textContent = user.name;
  $("#welcomeOverlay").hidden = false;
  $("#welcomeEnter").onclick = () => {
    $("#welcomeOverlay").hidden = true;
    enterApp(user);
  };
}

function enterApp(user) {
  $("#appShell").hidden = false;
  currentRoute = "dashboard";
  renderNav();
  renderPage();
}

/* ─────────── 23. ADMIN LOGIN ─────────── */
function openAdminLogin() {
  if (Admin.isLoggedIn()) {
    navigate("admin");
    return;
  }
  $("#adminPassword").value = "";
  $("#adminError").hidden = true;
  openModal("adminModal");
  setTimeout(() => $("#adminPassword").focus(), 150);
}

async function handleAdminSubmit() {
  const pw = $("#adminPassword").value;
  if (!pw) {
    $("#adminError").textContent = "رمز را وارد کنید";
    $("#adminError").hidden = false;
    return;
  }
  const submitBtn = $("#adminSubmit");
  submitBtn.disabled = true;
  submitBtn.textContent = "بررسی…";
  try {
    const ok = await Admin.verifyPassword(pw);
    if (!ok) {
      $("#adminError").textContent = "رمز اشتباه است";
      $("#adminError").hidden = false;
      $("#adminPassword").value = "";
      submitBtn.disabled = false;
      submitBtn.textContent = "ورود";
      return;
    }
    Admin.setSession();
    closeModal("adminModal");
    toast("به پنل مدیریت خوش آمدید", "success");
    navigate("admin");
  } catch (err) {
    console.error(err);
    $("#adminError").textContent = "خطای غیرمنتظره";
    $("#adminError").hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "ورود";
  }
}

/* ─────────── 24. BACKGROUND STARS ─────────── */
function initStars() {
  const bg = $("#bgStars");
  const count = Math.min(60, Math.floor(window.innerWidth / 30));
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "bg-star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 5 + "s";
    s.style.animationDuration = 3 + Math.random() * 4 + "s";
    bg.appendChild(s);
  }
}

/* ─────────── 25. BOOTSTRAP ─────────── */
async function bootstrap() {
  try {
    DB.load();
    await initAdminHash();
    initStars();

    // Auth tabs
    $$(".auth-tab").forEach(t => {
      t.addEventListener("click", () => setAuthMode(t.dataset.mode));
    });
    $("#authForm").addEventListener("submit", handleAuthSubmit);

    // Logout
    $("#logoutBtn").addEventListener("click", () => {
      if (!confirm("از حساب خارج می‌شوید؟")) return;
      Auth.logout();
      $("#appShell").hidden = true;
      $("#authScreen").hidden = false;
      setAuthMode("login");
      toast("از حساب خارج شدید");
    });
    $("#mobileLogout").addEventListener("click", () => {
      if (!confirm("از حساب خارج می‌شوید؟")) return;
      Auth.logout();
      $("#appShell").hidden = true;
      $("#authScreen").hidden = false;
      setAuthMode("login");
      toast("از حساب خارج شدید");
    });

    // Secret dot
    $("#secretDot").addEventListener("click", (e) => {
      e.stopPropagation();
      Admin.registerSecretClick(() => {
        openAdminLogin();
      });
    });

    // Admin modal
    $("#adminSubmit").addEventListener("click", handleAdminSubmit);
    $("#adminPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleAdminSubmit();
    });
    $("#adminCancel").addEventListener("click", () => closeModal("adminModal"));
    $("#adminModalClose").addEventListener("click", () => closeModal("adminModal"));
    $("#adminModal").addEventListener("click", (e) => {
      if (e.target === $("#adminModal")) closeModal("adminModal");
    });

    // Generic modal
    $("#genericModal").addEventListener("click", (e) => {
      if (e.target === $("#genericModal")) closeGenericModal();
    });

    // Check existing session
    const user = Auth.currentUser();
    if (user) {
      $("#authScreen").hidden = true;
      enterApp(user);
    } else {
      $("#authScreen").hidden = false;
      setAuthMode("login");
    }
  } catch (err) {
    console.error("Bootstrap error:", err);
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ff8080;font-family:sans-serif">' +
      "خطا در راه‌اندازی برنامه. لطفاً صفحه را دوباره بارگذاری کنید.<br>" +
      "<small>" + (err.message || "") + "</small></div>";
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootstrap);
} else {
  bootstrap();
}
</script>
